# KubyScoreboard – Einstellungen
# Rahmen, Logo und Icons aus dem Grafik-Pack KubyUI (nur für Spieler, die das Pack geladen haben)
scoreboard-logo-title: true
scoreboard:
  max-width: 140
  # Survival: Hinweis unten (Zeile 1 in Small Caps mit Spawn-Icon, Zeile 2 mit Pfeil in normaler Schrift)
  survival-hint-1: "<white>SPAWN VERLASSEN?"
  survival-hint-2: "<#D4C850>/bauwelt"
  title:
    smp: "<gold><bold>KUBY SMP"
    survival: "<gold><bold>KUBY SURVIVAL"
    hub: "<gold><bold>KUBY HUB"
  ranks:
    - "kuby.rank.legend;<gold>Legend"
    - "kuby.rank.warrior;<red>Warrior"
    - "kuby.rank.ultimate;<light_purple>Ultimate"
    - "kuby.rank.vip;<aqua>VIP"
# Resource Pack: direkter Download-Link und SHA-1 (leer = kein Versand)
resource-pack:
  url: ""
  sha1: ""
