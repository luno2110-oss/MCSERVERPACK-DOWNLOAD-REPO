reward:
  money: 2
  xp: 1
# Inseln der Spieler (/insel). Sie liegen in einer Spirale um den Skyblock-Spawn (0, 0) mit festem Abstand.
insel:
  abstand: 200                  # Abstand der Insel-Mitten (größte Insel muss kleiner sein)
  weltgrenze: 50000
  groessen: [15, 25, 35, 50, 70]  # Radius je Größen-Stufe (15 = 31 x 31 Blöcke)
  mitglieder: [2, 4, 6, 10]       # Mitglieder (ohne Besitzer) je Stufe
  upgrades:
    groesse: [0, 25000, 75000, 200000, 500000]   # Preis für Stufe 1, 2, ... (Index 0 = Start)
    mitglieder: [0, 10000, 40000, 100000]
  besucher-standard: true       # neue Inseln offen für Besucher
  pvp: true                     # Kampf zwischen Spielern in der Skyblock-Welt (nicht am Spawn)
  pvp-spawn-radius: 40
  void-rettung: true            # wer ins Leere fällt, landet zu Hause statt zu sterben
  neustart-abklingzeit-stunden: 24
  leeren-spalten-pro-tick: 400  # Neustart/Aufgeben: so viele Spalten je Tick leeren
  eingebaute-vorlagen: true     # Klassisch, Wüste, Schnee anbieten (eigene: /kp skyblock template save <id>)
  start-kiste: ["ICE:2", "LAVA_BUCKET:1", "BONE_MEAL:3", "MELON_SEEDS:1", "PUMPKIN_SEEDS:1", "SUGAR_CANE:1", "RED_MUSHROOM:1",
    "BROWN_MUSHROOM:1", "WHEAT_SEEDS:2"]

# Bruchstein-Generator: je Stufe Preis und Gewichte der Blöcke, die statt Bruchstein entstehen
generator:
  stufen:
    - {kosten: 0, bloecke: {COBBLESTONE: 100}}
    - {kosten: 5000, bloecke: {COBBLESTONE: 85, COAL_ORE: 10, IRON_ORE: 5}}
    - {kosten: 20000, bloecke: {COBBLESTONE: 75, COAL_ORE: 10, IRON_ORE: 8, COPPER_ORE: 4, GOLD_ORE: 3}}
    - {kosten: 60000, bloecke: {COBBLESTONE: 65, COAL_ORE: 10, IRON_ORE: 9, COPPER_ORE: 5, GOLD_ORE: 4, REDSTONE_ORE: 3, LAPIS_ORE: 3, DIAMOND_ORE: 1}}
    - {kosten: 150000, bloecke: {COBBLESTONE: 58, COAL_ORE: 10, IRON_ORE: 10, COPPER_ORE: 5, GOLD_ORE: 5, REDSTONE_ORE: 4, LAPIS_ORE: 4, DIAMOND_ORE: 2, EMERALD_ORE: 2}}
    - {kosten: 400000, bloecke: {COBBLESTONE: 50, COAL_ORE: 10, IRON_ORE: 11, COPPER_ORE: 5, GOLD_ORE: 6, REDSTONE_ORE: 4, LAPIS_ORE: 4, DIAMOND_ORE: 4, EMERALD_ORE: 3, ANCIENT_DEBRIS: 1}}

# Insel-Level: Punkte aller Blöcke auf der Insel (gezählt beim Bauen und mit /insel level)
level:
  punkte-pro-level: 100
  standard-wert: 1
  werte:
    DIRT: 0
    GRASS_BLOCK: 0
    COBBLESTONE: 0
    NETHERRACK: 0
    SAND: 0
    GRAVEL: 0
    STONE: 1
    IRON_BLOCK: 50
    GOLD_BLOCK: 80
    REDSTONE_BLOCK: 30
    LAPIS_BLOCK: 30
    EMERALD_BLOCK: 150
    DIAMOND_BLOCK: 300
    NETHERITE_BLOCK: 2000
    BEACON: 1000
    CONDUIT: 400
    DRAGON_EGG: 5000
    ENCHANTING_TABLE: 50
    ANVIL: 30
    HOPPER: 10
    SPAWNER: 500

# Generatoren (Grundmechanik): kaufen (/insel -> Generatoren -> Shop), auf die Insel stellen, Lager einsammeln.
# Arten: item (Ertrag je Stufe), geld (pro-sekunde $), xp (pro-sekunde XP). Qualitäten Silber, Gold, Diamant im Juwelenshop.
generatoren:
  max-stufe: 10
  plaetze: [3, 5, 8, 12, 16]         # Generatoren je Insel nach Größen-Stufe
  tick-sekunden: 10
  intervall-sekunden: 30             # Item-Generatoren: Stufe 1 ein Item alle 30 s
  tempo-pro-stufe: 0.12              # je Stufe 12 % schneller
  ertrag-pro-stufe: 0.35             # Geld/XP: je Stufe 35 % mehr
  lager-stunden: 2                   # Geld/XP: Lager reicht für 2 Stunden Ertrag
  lager: [64, 128, 256, 384, 512, 768, 1024, 1536, 2048, 3072]
  upgrade-kosten: [0, 2000, 5000, 12000, 25000, 50000, 100000, 200000, 400000, 800000]   # je Art mal Preis/5000
  qualitaeten:                       # Juwelen: Kauf eines neuen Premium-Generators / Veredeln eines vorhandenen
    silber: {juwelen: 150, veredeln: 100}
    gold: {juwelen: 400, veredeln: 300}
    diamant: {juwelen: 900, veredeln: 700}
  booster:
    - {name: "Booster x2 · 30 Minuten", faktor: 2, minuten: 30, juwelen: 60}
    - {name: "Booster x2 · 2 Stunden", faktor: 2, minuten: 120, juwelen: 200}
    - {name: "Booster x3 · 30 Minuten", faktor: 3, minuten: 30, juwelen: 150}
  typen:
    geld:
      art: geld
      name: "Geld-Generator"
      block: GOLD_BLOCK
      preis: 10000
      pro-sekunde: 0.5
    xp:
      art: xp
      name: "XP-Generator"
      block: SCULK_CATALYST
      preis: 8000
      pro-sekunde: 1.0
    erz:
      art: item
      name: "Erz-Generator"
      block: BLAST_FURNACE
      preis: 5000
      ertrag:
        1: {COAL: 50, RAW_COPPER: 30, RAW_IRON: 20}
        4: {COAL: 35, RAW_COPPER: 20, RAW_IRON: 25, RAW_GOLD: 12, REDSTONE: 8}
        7: {COAL: 25, RAW_IRON: 25, RAW_GOLD: 15, REDSTONE: 10, LAPIS_LAZULI: 10, DIAMOND: 3, EMERALD: 2}
    holz:
      art: item
      name: "Holz-Generator"
      block: BARREL
      preis: 3000
      ertrag:
        1: {OAK_LOG: 40, BIRCH_LOG: 30, SPRUCE_LOG: 30}
        5: {OAK_LOG: 20, BIRCH_LOG: 15, SPRUCE_LOG: 15, JUNGLE_LOG: 15, ACACIA_LOG: 15, DARK_OAK_LOG: 10, CHERRY_LOG: 10}
    farm:
      art: item
      name: "Farm-Generator"
      block: COMPOSTER
      preis: 3000
      ertrag:
        1: {WHEAT: 40, CARROT: 30, POTATO: 30}
        4: {WHEAT: 25, CARROT: 20, POTATO: 20, MELON_SLICE: 15, PUMPKIN: 10, SUGAR_CANE: 10}
        7: {WHEAT: 20, CARROT: 15, POTATO: 15, MELON_SLICE: 15, PUMPKIN: 10, SUGAR_CANE: 10, COCOA_BEANS: 8, NETHER_WART: 5, GLOW_BERRIES: 2}
    mob:
      art: item
      name: "Mob-Generator"
      block: CRYING_OBSIDIAN
      preis: 8000
      ab-insel-level: 5
      ertrag:
        1: {ROTTEN_FLESH: 40, BONE: 30, STRING: 30}
        4: {ROTTEN_FLESH: 25, BONE: 25, STRING: 20, GUNPOWDER: 15, SPIDER_EYE: 10, ARROW: 5}
        7: {ROTTEN_FLESH: 15, BONE: 20, STRING: 15, GUNPOWDER: 15, SPIDER_EYE: 10, ENDER_PEARL: 10, BLAZE_ROD: 8, SLIME_BALL: 7}
    nether:
      art: item
      name: "Nether-Generator"
      block: RESPAWN_ANCHOR
      preis: 15000
      ab-insel-level: 15
      ertrag:
        1: {NETHERRACK: 40, QUARTZ: 30, GLOWSTONE_DUST: 30}
        5: {NETHERRACK: 25, QUARTZ: 25, GLOWSTONE_DUST: 20, MAGMA_CREAM: 10, GOLD_NUGGET: 15, BLAZE_POWDER: 5}
        9: {NETHERRACK: 20, QUARTZ: 25, GLOWSTONE_DUST: 20, MAGMA_CREAM: 10, GOLD_NUGGET: 15, BLAZE_POWDER: 8, NETHERITE_SCRAP: 2}
    edelstein:
      art: item
      name: "Edelstein-Generator"
      block: AMETHYST_BLOCK
      preis: 40000
      ab-insel-level: 30
      intervall-faktor: 4
      ertrag:
        1: {AMETHYST_SHARD: 50, LAPIS_LAZULI: 30, EMERALD: 15, DIAMOND: 5}
        6: {AMETHYST_SHARD: 35, LAPIS_LAZULI: 25, EMERALD: 25, DIAMOND: 15}
        10: {AMETHYST_SHARD: 25, LAPIS_LAZULI: 20, EMERALD: 28, DIAMOND: 25, ECHO_SHARD: 2}

