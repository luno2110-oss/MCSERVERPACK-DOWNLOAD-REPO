# Insel-Leiste oben (wie in Survival): Geld, Insel-Level, XP, Generatoren, Ort, Uhrzeit. Spieler stellen Inhalt und
# Design (Insel, Wolke, Nether, End) in /bossbar ein; nur mit dem Grafik-Pack.
leiste:
  aktiv: true
  # bis zu diesem Abstand vom Skyblock-Spawn steht „Spawn“ als Ort
  spawn-radius: 48

# Insel-Level: Punkte aller Blöcke auf der Insel (gezählt beim Bauen und mit /insel level)
level:
  punkte-pro-level: 100
  standard-wert: 1
  # Inselpunkte zusätzlich zu den Blöcken: je gekauftem Upgrade-Level und je Generator (Grundwert, je Stufe +30 %,
  # Silber/Gold/Diamant x1,6/x2,2/x2,8, Stufen-Generatoren x1,5). Bleiben beim Neu-Zählen erhalten.
  bonus:
    upgrade-level: 40
    generator: 60
    generator-je-stufe: 0.3
  werte:
    DIRT: 0
    GRASS_BLOCK: 0
    COBBLESTONE: 0
    NETHERRACK: 0
    SAND: 0
    GRAVEL: 0
    STONE: 1
    IRON_BLOCK: 50
    GOLD_BLOCK: 80
    REDSTONE_BLOCK: 30
    LAPIS_BLOCK: 30
    EMERALD_BLOCK: 150
    DIAMOND_BLOCK: 300
    NETHERITE_BLOCK: 2000
    BEACON: 1000
    CONDUIT: 400
    DRAGON_EGG: 5000
    ENCHANTING_TABLE: 50
    ANVIL: 30
    HOPPER: 10
    SPAWNER: 500

# Generatoren (Grundmechanik, nur in der UI): kaufen (/insel -> Generatoren -> Shop), laufen sofort, Lager einsammeln.
# Arten: item (Ertrag je Stufe), geld (pro-sekunde $), xp (pro-sekunde XP). Qualitäten Silber, Gold, Diamant im Juwelenshop.
generatoren:
  # Fortschritt: Kaufpreis und Aufwerten günstiger, Ertrag schneller und höher (gelten zusätzlich zu den Werten unten)
  kauf-faktor: 0.7
  upgrade-faktor: 0.85
  tempo-faktor: 1.6                  # Item-Generatoren 60 % schneller
  geld-faktor: 2.0                   # Geld- und XP-Generatoren doppelter Ertrag
  lager-faktor: 1.5                  # Lager reicht länger
  max-stufe: 10
  plaetze: [3, 5, 8, 12, 16]         # Generator-Plätze je Bereich (Insel, Nether, End) nach Größen-Stufe
  tick-sekunden: 10
  intervall-sekunden: 30             # Item-Generatoren: Stufe 1 ein Item alle 30 s
  tempo-pro-stufe: 0.12              # je Stufe 12 % schneller
  ertrag-pro-stufe: 0.35             # Geld/XP: je Stufe 35 % mehr
  lager-stunden: 2                   # Geld/XP: Lager reicht für 2 Stunden Ertrag
  lager: [64, 128, 256, 384, 512, 768, 1024, 1536, 2048, 3072]
  upgrade-kosten: [0, 2000, 5000, 12000, 25000, 50000, 100000, 200000, 400000, 800000]   # je Art mal Preis/5000
  qualitaeten:                       # Juwelen: Kauf eines neuen Premium-Generators / Veredeln eines vorhandenen
    silber: {juwelen: 150, veredeln: 100}
    gold: {juwelen: 400, veredeln: 300}
    diamant: {juwelen: 900, veredeln: 700}
  booster:
    - {name: "Booster x2 · 30 Minuten", faktor: 2, minuten: 30, juwelen: 60}
    - {name: "Booster x2 · 2 Stunden", faktor: 2, minuten: 120, juwelen: 200}
    - {name: "Booster x3 · 30 Minuten", faktor: 3, minuten: 30, juwelen: 150}
  typen:
    geld:
      art: geld
      name: "Geld-Generator"
      block: GOLD_BLOCK
      preis: 10000
      pro-sekunde: 0.5
    xp:
      art: xp
      name: "XP-Generator"
      block: SCULK_CATALYST
      preis: 8000
      pro-sekunde: 1.0
    erz:
      art: item
      name: "Erz-Generator"
      block: BLAST_FURNACE
      preis: 5000
      ertrag:
        1: {COAL: 50, RAW_COPPER: 30, RAW_IRON: 20}
        4: {COAL: 35, RAW_COPPER: 20, RAW_IRON: 25, RAW_GOLD: 12, REDSTONE: 8}
        7: {COAL: 25, RAW_IRON: 25, RAW_GOLD: 15, REDSTONE: 10, LAPIS_LAZULI: 10, DIAMOND: 3, EMERALD: 2}
    holz:
      art: item
      name: "Holz-Generator"
      block: BARREL
      preis: 3000
      ertrag:
        1: {OAK_LOG: 40, BIRCH_LOG: 30, SPRUCE_LOG: 30}
        5: {OAK_LOG: 20, BIRCH_LOG: 15, SPRUCE_LOG: 15, JUNGLE_LOG: 15, ACACIA_LOG: 15, DARK_OAK_LOG: 10, CHERRY_LOG: 10}
    farm:
      art: item
      name: "Farm-Generator"
      block: COMPOSTER
      preis: 3000
      ertrag:
        1: {WHEAT: 40, CARROT: 30, POTATO: 30}
        4: {WHEAT: 25, CARROT: 20, POTATO: 20, MELON_SLICE: 15, PUMPKIN: 10, SUGAR_CANE: 10}
        7: {WHEAT: 20, CARROT: 15, POTATO: 15, MELON_SLICE: 15, PUMPKIN: 10, SUGAR_CANE: 10, COCOA_BEANS: 8, NETHER_WART: 5, GLOW_BERRIES: 2}
    mob:
