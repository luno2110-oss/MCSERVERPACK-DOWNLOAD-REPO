# One-Block: höchstens drei Plattformen (/kp skyblock oneblock setup). Ein Skyblock-Team kann eine beanspruchen
# (/oneblock): dann bauen nur seine Mitglieder dort ab, jeder Abbau bringt Block-XP fürs Team, Mitglieder können
# eigene XP einzahlen. Mit Block-XP kauft das Team Upgrades. Daten in oneblock.yml.
# verteilt: true = die drei One-Blöcke liegen einzeln weit draußen auf der Map (Plätze werden einmal ausgewürfelt und in
# oneblock.yml gespeichert, abstand-min bis abstand-max Blöcke vom Spawn, in drei Richtungen). Man muss sie erst finden
# (auf 32 Blöcke heran), das Menü zeigt nur Himmelsrichtung und ungefähre Entfernung. Erst danach: hinreisen und
# beanspruchen. false = feste Plätze aus positions (am Spawn, mit Brücke).
oneblock:
  verteilt: true
  abstand-min: 6000
  abstand-max: 20000
  hoehe: 100
  positions:
    - "-40;100;-60"
    - "0;100;-60"
    - "40;100;-60"
  money: 5            # $ je Abbau (Geld-Bonus: +5 % je Level)
  xp: 3               # XP je Abbau (XP-Bonus: +5 % je Level)
  team-xp: 2          # Block-XP fürs Team je Abbau (mit XP-Bonus)
  cooldown: 1.5       # Sekunden bis der neue Block erscheint (Cooldown-Upgrade: -4 % je Level, höchstens -80 %)
  claim:
    preis: 25000      # $ zum Beanspruchen
    min-mitglieder: 1 # so viele Leute muss das Team haben
    verfall-tage: 7   # wer so lange nicht abbaut, verliert die Plattform (Upgrades bleiben beim Team)
  # Upgrades: Level 0 bis 50 in vier Stufen (1-10, 11-15, 16-20, 21-50). Level 1-20 kosten Block-XP = basis *
  # faktor^Level, Level 21-50 (Stufe 4) nur Juwelen des Spielers (juwelen-stufe). Bis Level 20: Glück seltene Blöcke
  # öfter, Cooldown -80 %, Tempo Eile I bis V, XP/Geld +100 %, Beute 40 %. Stufe 4 legt drauf bis Level 50: Cooldown
  # -95 %, Tempo Eile VIII, XP/Geld +200 %, Beute 70 %, Glück noch stärker. Alte Stände werden beim Laden umgerechnet.
  upgrades:
    glueck: {max: 50, basis: 125, faktor: 1.245}
    cooldown: {max: 50, basis: 100, faktor: 1.225}
    tempo: {max: 50, basis: 150, faktor: 1.218}
    xp: {max: 50, basis: 100, faktor: 1.225}
    geld: {max: 50, basis: 100, faktor: 1.225}
    beute: {max: 50, basis: 150, faktor: 1.245}
  # Stufe 4 wie bei der Insel (basis 15 = ca. 10 €, 22.5 = ca. 15 € für Level 21 bis 50), bezahlt der Spieler, der klickt
  juwelen-stufe:
    basis: 15
    faktor: 1.05
    je-upgrade: {glueck: 22.5, beute: 22.5, geld: 18, xp: 15, cooldown: 15, tempo: 15}
  blocks:             # Block: Gewicht (je kleiner, desto seltener)
    STONE: 14
    DIRT: 8
    GRASS_BLOCK: 6
    OAK_LOG: 7
    BIRCH_LOG: 4
    SAND: 6
    GRAVEL: 5
    CLAY: 3
    COAL_ORE: 8
    COPPER_ORE: 6
    IRON_ORE: 5
    GOLD_ORE: 3
    REDSTONE_ORE: 3
    LAPIS_ORE: 2
    MELON: 2
    PUMPKIN: 2
    OBSIDIAN: 1
    EMERALD_ORE: 1
    DIAMOND_ORE: 1
