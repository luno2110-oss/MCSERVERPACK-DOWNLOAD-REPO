reward:
  money: 2
  xp: 1
# Inseln der Spieler (/insel). Sie liegen in einer Spirale um den Skyblock-Spawn (0, 0) mit festem Abstand.
insel:
  abstand: 200                  # Abstand der Insel-Mitten (größte Insel muss kleiner sein)
  weltgrenze: 50000
  groessen: [15, 25, 35, 50, 70]  # Radius je Größen-Stufe (15 = 31 x 31 Blöcke)
  mitglieder: [2, 4, 6, 10]       # Mitglieder (ohne Besitzer) je Stufe
  upgrades:
    groesse: [0, 25000, 75000, 200000, 500000]   # Preis für Stufe 1, 2, ... (Index 0 = Start)
    mitglieder: [0, 10000, 40000, 100000]
  besucher-standard: true       # neue Inseln offen für Besucher
  pvp: true                     # Kampf zwischen Spielern in der Skyblock-Welt (nicht am Spawn)
  pvp-spawn-radius: 40
  void-rettung: true            # wer ins Leere fällt, landet zu Hause statt zu sterben
  neustart-abklingzeit-stunden: 24
  leeren-spalten-pro-tick: 400  # Neustart/Aufgeben: so viele Spalten je Tick leeren
  eingebaute-vorlagen: true     # Klassisch, Wüste, Schnee anbieten (eigene: /kp skyblock template save <id>)
  start-kiste: ["ICE:2", "LAVA_BUCKET:1", "BONE_MEAL:3", "MELON_SEEDS:1", "PUMPKIN_SEEDS:1", "SUGAR_CANE:1", "RED_MUSHROOM:1",
    "BROWN_MUSHROOM:1", "WHEAT_SEEDS:2"]

# Bruchstein-Generator: je Stufe Preis und Gewichte der Blöcke, die statt Bruchstein entstehen
generator:
  stufen:
    - {kosten: 0, bloecke: {COBBLESTONE: 100}}
    - {kosten: 5000, bloecke: {COBBLESTONE: 85, COAL_ORE: 10, IRON_ORE: 5}}
    - {kosten: 20000, bloecke: {COBBLESTONE: 75, COAL_ORE: 10, IRON_ORE: 8, COPPER_ORE: 4, GOLD_ORE: 3}}
    - {kosten: 60000, bloecke: {COBBLESTONE: 65, COAL_ORE: 10, IRON_ORE: 9, COPPER_ORE: 5, GOLD_ORE: 4, REDSTONE_ORE: 3, LAPIS_ORE: 3, DIAMOND_ORE: 1}}
    - {kosten: 150000, bloecke: {COBBLESTONE: 58, COAL_ORE: 10, IRON_ORE: 10, COPPER_ORE: 5, GOLD_ORE: 5, REDSTONE_ORE: 4, LAPIS_ORE: 4, DIAMOND_ORE: 2, EMERALD_ORE: 2}}
    - {kosten: 400000, bloecke: {COBBLESTONE: 50, COAL_ORE: 10, IRON_ORE: 11, COPPER_ORE: 5, GOLD_ORE: 6, REDSTONE_ORE: 4, LAPIS_ORE: 4, DIAMOND_ORE: 4, EMERALD_ORE: 3, ANCIENT_DEBRIS: 1}}

# Insel-Level: Punkte aller Blöcke auf der Insel (gezählt beim Bauen und mit /insel level)
level:
  punkte-pro-level: 100
  standard-wert: 1
  werte:
    DIRT: 0
    GRASS_BLOCK: 0
    COBBLESTONE: 0
    NETHERRACK: 0
    SAND: 0
    GRAVEL: 0
    STONE: 1
    IRON_BLOCK: 50
    GOLD_BLOCK: 80
    REDSTONE_BLOCK: 30
    LAPIS_BLOCK: 30
    EMERALD_BLOCK: 150
    DIAMOND_BLOCK: 300
    NETHERITE_BLOCK: 2000
    BEACON: 1000
    CONDUIT: 400
    DRAGON_EGG: 5000
    ENCHANTING_TABLE: 50
    ANVIL: 30
    HOPPER: 10
    SPAWNER: 500

oneblock:
  positions:
    - "-40;100;-60"
    - "0;100;-60"
    - "40;100;-60"
  money: 5
  xp: 3
  blocks:
    STONE: 10
    COAL_ORE: 6
    IRON_ORE: 4
    GOLD_ORE: 3
    DIAMOND_ORE: 1
    OAK_LOG: 6
    SAND: 5
# Loot-Inseln (/kp skyblock loot generate). Loot je Stufe: im Spiel bearbeitete Tabelle (/kp skyblock loot edit <stufe>),
