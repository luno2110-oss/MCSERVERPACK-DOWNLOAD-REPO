# Stufen: Nether und End als eigene Welten (keine Vanilla-Dimensionen). Jede Insel bekommt dort eine eigene Stufen-Insel an
# derselben Stelle wie im Skyblock (Start-Insel mit Portal, Truhe und dem Nötigsten). Freischalten mit /insel stufen
# (Besitzer und Co-Besitzer), hin mit /insel nether, /insel end oder durch ein Portal auf der Insel (das Plugin reist
# beim Betreten des Portals selbst, allow-nether und allow-end spielen keine Rolle). Bedingungen:
#   jede-art: von jeder Generator-Art der vorigen Stufe mindestens einer auf der Insel (Nether: alle normalen Arten,
#             End: alle Nether-Arten; End braucht außerdem die Nether-Stufe)
#   alle-max: diese Generatoren alle auf dem höchsten Level (generatoren.max-stufe). Dauert das zu lange: auf false
#             stellen, dann reicht je Art einer.
#   insel-level: Mindest-Level der Insel (0 = keine Bedingung)
# generator: Block-Generator der Stufe. Nether: wo sonst Basalt entsteht (Lava über Seelenerde neben Blaueis), End: wo
# sonst Bruchstein oder Stein entsteht. Tabelle je Level des Insel-Generator-Upgrades (höchste erreichte Schwelle zählt).
stufen:
  nether:
    welt: skyblock_nether
    jede-art: true
    alle-max: true
    insel-level: 0
    generator:
      0: {NETHERRACK: 50, BASALT: 20, BLACKSTONE: 14, MAGMA_BLOCK: 6, NETHER_QUARTZ_ORE: 7, NETHER_GOLD_ORE: 3}
      10: {NETHERRACK: 40, BASALT: 14, BLACKSTONE: 14, MAGMA_BLOCK: 6, NETHER_QUARTZ_ORE: 12, NETHER_GOLD_ORE: 8, GLOWSTONE: 4, GILDED_BLACKSTONE: 2}
      20: {NETHERRACK: 32, BASALT: 12, BLACKSTONE: 12, MAGMA_BLOCK: 5, NETHER_QUARTZ_ORE: 15, NETHER_GOLD_ORE: 10, GLOWSTONE: 7, GILDED_BLACKSTONE: 5, ANCIENT_DEBRIS: 2}
      35: {NETHERRACK: 25, BASALT: 10, BLACKSTONE: 10, MAGMA_BLOCK: 5, NETHER_QUARTZ_ORE: 17, NETHER_GOLD_ORE: 12, GLOWSTONE: 9, GILDED_BLACKSTONE: 8, ANCIENT_DEBRIS: 4}
  end:
    welt: skyblock_end
    jede-art: true
    alle-max: true
    insel-level: 0
    generator:
      0: {END_STONE: 70, END_STONE_BRICKS: 10, PURPUR_BLOCK: 12, OBSIDIAN: 8}
      10: {END_STONE: 55, END_STONE_BRICKS: 12, PURPUR_BLOCK: 15, PURPUR_PILLAR: 5, OBSIDIAN: 9, CRYING_OBSIDIAN: 4}
      20: {END_STONE: 45, END_STONE_BRICKS: 12, PURPUR_BLOCK: 15, PURPUR_PILLAR: 8, OBSIDIAN: 10, CRYING_OBSIDIAN: 6, END_ROD: 4}
      35: {END_STONE: 38, END_STONE_BRICKS: 12, PURPUR_BLOCK: 15, PURPUR_PILLAR: 8, OBSIDIAN: 10, CRYING_OBSIDIAN: 8, END_ROD: 6, SHULKER_BOX: 1}

# Skyblock-Shop (/shop, /sell, Shop-Kachel; auch /insel shop): "MATERIAL;Menge;Kaufpreis;Verkaufspreis je Stück;Name".
# Kaufpreis 0 = nur verkaufen, Verkaufspreis 0 = nur kaufen. Die Verkaufspreise gelten auch für Generator-Ertrag.
# Upgrade Wachstum: Chance je Level, dass eine Pflanze beim Wachsen gleich eine Stufe mehr wächst (Level 20 = 100 %).
# In Stufe 4 (Level 21-50) kommt je Level bonus-stufe4 dazu: über 100 % gibt es sicher eine Stufe mehr und mit dem Rest
# eine zweite (Level 50 = 200 %).
wachstum:
  bonus-je-stufe: 0.05
  bonus-stufe4: 0.0333
# Upgrade Spawnrate: Chance je Level auf ein zweites Wesen beim natürlichen Spawnen und aus echten Spawnern (Level 20 = 80 %,
# Level 50 = 140 %: über 100 % sicher ein zweites, mit dem Rest ein drittes; die Limits gelten weiter)
spawnrate:
  bonus-je-stufe: 0.04
  bonus-stufe4: 0.02

# Lag-Grenzen je Insel (mit ihren Biom-Inseln). Das Upgrade „Limits“ hebt alle Grenzen je Level um bonus-je-stufe an.
limits:
  aktiv: true
  bonus-je-stufe: 0.05
  bloecke:
    trichter: {name: Trichter, max: 48, items: [HOPPER]}
    kolben: {name: Kolben, max: 32, items: [PISTON, STICKY_PISTON]}
    beobachter: {name: Beobachter, max: 24, items: [OBSERVER]}
    werfer: {name: Werfer & Spender, max: 24, items: [DISPENSER, DROPPER]}
    redstone: {name: Verstärker & Komparatoren, max: 64, items: [REPEATER, COMPARATOR]}
  wesen:
    tiere: 60
    monster: 50
    dorfbewohner: 20
    golems: 4

