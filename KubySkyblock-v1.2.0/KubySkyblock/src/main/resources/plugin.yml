name: KubySkyblock
version: 1.3.0
main: de.kuby.kubyskyblock.KubySkyblock
api-version: '1.21'
depend: [KubyCore]
description: Skyblock-Modus für KubyCore (Inseln mit Mitgliedern und Upgrades, Generatoren, Loot-Inseln, One-Block mit Team-Upgrades, Checkliste)
commands:
  skyblock:
    description: "Skyblock-Checkliste und Erfolge"
    usage: "/skyblock"
  insel:
    description: "Deine Insel: Zuhause, Mitglieder, Upgrades, Level, Top-Inseln"
    usage: "/insel [home|einladen|annehmen|besuchen|top|level|upgrade|neustart|aufgeben]"
    aliases: [is, island]
  combo:
    description: "Combo-Rangliste von heute: beste Combo, Preise für die ersten drei um Mitternacht"
    usage: "/combo"
    aliases: [combotop, comborang]
  oneblock:
    description: "One-Block: Plattform fürs Team beanspruchen, Block-XP, Upgrades"
    usage: "/oneblock [beanspruchen <Nr>|freigeben|einzahlen <Menge|alles>|upgrade <Art>|tp <Nr>]"
    aliases: [ob]
