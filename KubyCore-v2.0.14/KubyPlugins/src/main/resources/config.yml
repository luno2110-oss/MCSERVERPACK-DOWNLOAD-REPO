    - "gluecksritter;Glücksritter|Lucky Knight;bell;CRATE;3;150"
    - "zombies;Zombiejagd|Zombie Hunt;iron_sword;KILL:ZOMBIE;25;100"
    - "skelette;Knochenbrecher|Bone Breaker;bow;KILL:SKELETON;20;100"
    - "angler;Angler|Angler;rod;FISH;15;100"
    - "holz;Holzfäller|Lumberjack;iron_axe;MINE:LOG;64;100"
    - "erze;Bergmann|Miner;iron_pickaxe;MINE:ORE;40;120"
    - "zuechter;Züchter|Breeder;wheat;BREED;10;100"
    - "koch;Feinschmecker|Gourmet;cooked_beef;EAT;10;80"
    - "spielzeit;Stammgast|Regular;clock;PLAYTIME;60;120"
    - "wanderer;Wanderer|Hiker;compass;TRAVEL;3;100"
    - "vote;Unterstützer|Supporter;paper;VOTE;1;80"
