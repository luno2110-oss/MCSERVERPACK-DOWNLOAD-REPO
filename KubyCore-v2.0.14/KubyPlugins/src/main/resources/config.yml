  messages:
    - "In <white>/settings</white> schaltest du Chat, Anfragen, Mitteilungen und Anzeigen mit einem Klick um."
    - "Mit <white>/tpahere Name</white> holst du jemanden zu dir. Auto-TPA in /settings nimmt Anfragen von Freunden sofort an."
