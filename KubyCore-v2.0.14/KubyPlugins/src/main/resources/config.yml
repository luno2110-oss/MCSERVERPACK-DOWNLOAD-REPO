# Kisten und Schlüssel laufen über Phoenix Crates.
# Stündlicher Universal-Schlüssel (Schlüssel-Name: keyall_key).
# Trage hier den Phoenix-Befehl ein, {player} wird durch den Spielernamen ersetzt.
# Beispiel (bitte an deine Phoenix-Syntax anpassen): "crates givekey {player} keyall_key 1"
