    - "Kisten öffnest du mit virtuellen Schlüsseln: <white>/keys</white>"
    - "Probleme oder Fragen? <white>/support</white> erstellt ein Ticket."
  messages-en:
    - "In <white>/settings</white> you switch chat, requests, alerts and displays with one click."
    - "Use <white>/tpahere name</white> to pull someone to you. Auto TPA in /settings accepts friends at once."
    - "The action bar can show coordinates or the time: <white>/settings</white> → Display."
    - "See your friends with <white>/friends</white>. Friends can message you even when messages are off."
    - "Vote daily for jewels and keys: <white>/vote</white>"
    - "Open crates with virtual keys: <white>/keys</white>"
    - "Problems or questions? <white>/support</white> opens a ticket."

# Neuerungen, die Spieler beim Betreten sehen (Schalter "Changelog beim Join"). Format "JJJJ-MM-TT: Text",
