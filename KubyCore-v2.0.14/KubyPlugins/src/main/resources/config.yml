  - "2026-10-25: Neue Einstellungen mit fünf Reitern: <white>/settings</white>"

# Auto-Übersetzen im Chat (Schalter unten in /settings). provider: none, deepl oder libre.
# deepl: key = API-Schlüssel von deepl.com (kostenlos bis 500.000 Zeichen im Monat). libre: url = LibreTranslate-Server,
# key nur, wenn der Server einen verlangt. Ohne Dienst lässt sich der Schalter nicht einschalten.
translate:
  provider: none
  url: ""
  key: ""

# Survival: Leiste oben (Platz der Bossbar) mit Geld, Juwelen, Angel-Level und Ort. Ersetzt dort die Anzeige
# über der Hotbar. Braucht das Pack KubyUI (macht weiße Bossbars unsichtbar, die Leiste nutzt nur den Titel).
survival-hud:
  enabled: true
  spawn-radius: 80

# Survival-Jobs (KubySurvival): Holzfäller, Miner, Farmer, Jäger, Angler. Ein Job ist aktiv, nur er bringt XP und Coins.
# Kein Lohn für selbst gesetzte Blöcke, Generator-Steine, Spawner-Mobs, gezüchtete Tiere und unreife Pflanzen.
farmpass:
  store-url: "https://store.example.net"   # Link im /farmpass-Menü
  price-text: "9,99 € im Monat, jederzeit kündbar"
  extra-homes: 2
  market-listings: 15             # Plätze im Markt mit Pass
  claim-blocks-per-month: 250     # bleiben für immer
  fly-regions: [casino]           # Regionen (/kp region), in denen Pass-Spieler fliegen dürfen, dazu Spawn und Grundstücke
  weekly-chest:                   # Wochenkiste: Coins, Tokens und Items (MATERIAL;Anzahl)
    coins: 2500
    tokens: 3
    items:
      - "GOLDEN_CARROT;32"
      - "EXPERIENCE_BOTTLE;16"
      - "DIAMOND;3"
  pets: [fuchs, axolotl, panda, papagei]              # 4 Haustiere nur für den Pass
  monthly-pets: [katze, hund, hase, schildkroete, biene, frosch, ziege, guerteltier]   # pro bezahltem Monat eins zum Behalten

level:
