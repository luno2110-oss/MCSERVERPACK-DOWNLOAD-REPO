  season-start: "2026-10-01"
  season-days: 90
  first-season: 1
  premium-price: 1000
  premium-perks: "Ausrüstung, Spawner und Kosmetik"
  premium-perks-en: "Gear, spawners and cosmetics"
  level-price: 100
  level-daily-limit: 999
  key-command: "keys give %player% keyall 1"
  key-name: "Keyall-Schlüssel"
  xp-per-level: 250
  daily-count: 4
  weekly-count: 6
  rewards: []
  quests-daily:
    - "spinnen;Spinnenfänger|Spider Catcher;iron_sword;KILL:SPIDER;20;100"
    - "redstone;Redstone-Rausch|Redstone Rush;iron_pickaxe;COLLECT:REDSTONE;128;120"
