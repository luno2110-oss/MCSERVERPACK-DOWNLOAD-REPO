# Battle-Pass (/battlepass, Dialog mit Grafik-Pack, sonst Truhen-Menü). 100 Stufen, Punkte aus Aufgaben.
# Season: first-season beginnt am season-start und dauert season-days Tage, danach automatisch die nächste
# (alle starten wieder bei Stufe 0 ohne Premium). Premium und Stufen kosten Juwelen.
# rewards (leer = Standard): STUFE;FREE|PREMIUM;COINS|XP|JEWELS|COMMAND|ITEM;WERT[;ICON[;NAME]]
#   z. B. "6;PREMIUM;ITEM;DIAMOND_PICKAXE" oder "4;FREE;COMMAND;keys give %player% episch 1;bp_key;Episch-Schlüssel"
# Aufgaben: ID;Name|English;ICON;TYP[:ZIEL];ANZAHL;PUNKTE[;modi]. Jeden Tag daily-count aus quests-daily, jede Woche
#   (Montag) weekly-count aus quests-weekly, für alle Spieler gleich. Typen: KILL (Ziel: Mob, MONSTER, ANIMAL, BOSS),
#   MINE (Block, ORE, LOG), COLLECT (Drop, z. B. REDSTONE), FISH, BREED, TAME, CRATE, LEVELS, TRAVEL (km),
#   PLAYTIME (Minuten), VOTE, TRADE, DUEL, DAILY, EAT, CRAFT, ENCHANT, PLACE. modi: z. B. smp (sonst überall).
#   ICON: iron_sword, iron_pickaxe, wheat, bell, rod, bow, clock, experience, emerald, ender_pearl, compass ...
