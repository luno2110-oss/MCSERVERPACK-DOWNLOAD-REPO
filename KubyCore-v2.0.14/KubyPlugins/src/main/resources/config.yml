# Angeln in Survival (KubySurvival): 48 Fischarten auf 6 Gewässern, Seltenheiten und Sterne, Angel-Punkte und
# Level, Upgrades und Köder (/angeln). Angel-Zonen (/kp angel zone): +10 % Glück, -10 % Wartezeit,
# Mythen-Fische und Schätze nur dort. Preise je Seltenheit: Gewöhnlich 2-8, Ungewöhnlich 5-19, Selten 14-53,
# Episch 45-169, Legendär 180-675, Mythisch 900-3.375 (1 bis 5 Sterne).
angeln:
  dealer:
    # So viel zahlt der Händler pro Stunde und Spieler zum vollen Preis, darüber nur noch over-budget-percent.
    # (Balance: Jobs bringen 300+ Coins pro Stunde, Angeln mit Budget etwa 1.000 bis 1.500.)
    hour-budget: 1000
    over-budget-percent: 20
  # Belohnung für eine volle Fischbuch-Seite (alle 8 Arten)
  page-coins: 3000
  page-tokens: 2
  # Auto-Verkauf (Fische bis Ungewöhnlich sofort verkaufen), einmalig
  auto-sell-tokens: 150
  # Doppelfang im Token-Shop: 3 Stufen zu je 5 % Chance auf zwei Fische, Preis = Wert * Stufe
  double-catch-tokens: 100
  tournament:
    rewards: [5000, 2500, 1000]

jewelshop:
  survival:
    categories:
      - "ranks;Ränge;NAME_TAG;ITEMS;true"
      - "keys;Keys;TRIPWIRE_HOOK;ITEMS;true"
      - "jewels;Juwelen;EMERALD;PACKAGES;true"
      - "battlepass;Battlepass;BOOK;PLACEHOLDER;false"
      - "packs;Vorteilspakete;CHEST;PLACEHOLDER;false"
