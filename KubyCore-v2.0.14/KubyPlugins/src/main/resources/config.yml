# Grafik-Pack "KubyUI" für Menüs (Casino-Hilfe): wird beim Join zusätzlich zu anderen Packs geschickt.
ui:
  pack-url: "https://github.com/luno2110-oss/MCSERVERPACK-DOWNLOAD-REPO/releases/download/latest/KubyUI-Pack.zip"
  pack-prompt: "Grafiken für Menüs und Casino"
  pack-force: false
  # auto = eigene Grafiken nur, wenn das Pack beim Spieler geladen ist; on = immer; off = nie
  custom-textures: auto

# Meldungen (/report): Spieler mit kuby.report.see sehen sie. Die Regeln (/regeln) stehen in regeln.yml.
rules:
  report-cooldown-seconds: 60

# Survival-Einstieg (KubySurvival). /bauwelt: fester Punkt (leer = Zufallsteleport). Brunnen am Spawn: Region mit dieser ID
# (/kp region ...), wer hineinläuft, kommt in die Bauwelt. Punkt setzen: /kp bauwelt setzen
bauwelt:
  location: ""
  fountain-region: "bauwelt-brunnen"
# /tutorial: Stationen "Ort;Titel;Text", anlegen mit /kp tutorial add <Titel>|<Text>. Belohnung beim ersten Abschluss.
tutorial:
  reward-coins: 500
  reward-tokens: 3
  stations: []
# Heiraten (KubySurvival): Antrag mit /marry propose, Ja-Wort beim Priester (/kp heiraten priester), beide müssen im
# Umkreis stehen. Die Hochzeit zahlt, wer gefragt hat. Nach der Scheidung Sperre für beide.
marry:
  cost: 5000                      # Coins für die Hochzeit
  proposal-minutes: 10            # so lange gilt ein Antrag
  priest-radius: 10               # beide Partner höchstens so weit vom Priester
  divorce-cooldown-days: 7        # danach dürfen beide wieder heiraten
# Bank (KubySurvival): Ehe-Konto und Konten mit Freunden. Bankier per /kp bank bankier, "an der Bank" = in bank.radius
# Blöcken um ihn. Unterwegs höchstens limit-away Coins je Buchung, an der Bank ohne Grenze.
bank:
  limit-away: 10000
  radius: 8
  max-friend-accounts: 3          # Konten mit Freunden je Spieler (als Mitglied oder Besitzer)
  max-members: 5                  # Mitglieder je Konto mit Freunden
# Kopf-Datenbank /heads (KubySurvival): Preis je Kopf. Köpfe stehen in plugins/KubySurvival/heads.yml.
heads:
  price: 1000
# Gräber (KubySurvival): beim Tod in Survival entsteht ein Grabstein mit allen Sachen und XP. So lange kommt nur der
# Besitzer heran (Farmpass länger), danach zerfällt das Grab und alles fällt heraus. Tod im Void: Abholbox.
graves:
  minutes: 30
  farmpass-minutes: 60
  xp-percent: 100                 # Anteil der XP, der ins Grab kommt
# Möbel (KubySurvival): Kauf im Juwelenshop (Kategorie Möbel, Preis nach Größe), höchstens so viele je Spieler.
furniture:
  max: 50
# Freunde (/friends): Plätze in der Liste, mit Rang mehr (Permission kuby.rank.<name> oder LuckPerms group.<name>).
# Nachspringen (/friend jump) mit der Teleport-Wartezeit der Homes, danach jump-cooldown-seconds Pause.
friends:
  limit: 20
  ranks:
    vip: 30
    ultimate: 40
    warrior: 50
    legend: 75
    platin: 30
    diamant: 40
    smaragd: 50
    netherit: 75
  jump-cooldown-seconds: 30

# Support-Tickets (/support): Helfer werden kann, wer so viele Stunden gespielt hat (und Discord verlinkt, wenn
# DiscordSRV da ist). Team = Permission kuby.support.team. Höchstens max-open offene Tickets je Spieler.
support:
  helper-min-hours: 50
  max-open: 2

