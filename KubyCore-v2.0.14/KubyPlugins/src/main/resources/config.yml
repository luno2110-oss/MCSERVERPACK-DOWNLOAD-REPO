casino:
  open: true
  # 1 Chip = 1 Coin (wie im Referenz-Clip). Alte Stände mit 100 Coins je Chip werden beim Start einmalig umgerechnet.
  cashout-tax-percent: 5        # Steuer beim Rücktausch Chips -> Coins (Farmpass: keine)
  jackpot-start: 10000
  kasse-radius: 5
  jackpot-share: 0.01
  jackpot:
    draw-day: SATURDAY
    draw-time: "18:00"
    seven-wins: false
  vip:
    region: casino-vip
    daily-chips: 500
    top: 10
    rank-permissions:
      - group.legend
      - kuby.rank.legend
  music:
    volume: 0.6
  poker:
    small-blind: 10
    big-blind: 20
    min-buyin-bb: 40
    max-buyin-bb: 200
    turn-seconds: 30
  blackjack:
    min-bet: 10
    max-bet: 10000              # je Platz und Runde (vor Doppeln/Teilen)
    bet-seconds: 8              # Countdown nach dem ersten Einsatz
    turn-seconds: 15            # Zeit pro Zug, danach wird gehalten
  roulette:
    wait-seconds: 20
    min-bet: 10
    max-round: 100000           # höchstens so viele Chips je Spieler und Runde
    range: 12                   # so nah muss man am Tisch stehen
  crash:
    min-bet: 10                 # kleinster Einsatz je Runde
    max-bet: 100000             # größter Einsatz je Spieler und Runde
    wait-seconds: 10            # Countdown nach dem ersten Einsatz
    rate: 0.07                  # Tempo: Multiplikator = e^(rate * Sekunden), 2x nach knapp 10 s
    max-multiplier: 50          # Höchstwert, dort wird automatisch ausgezahlt
    house-edge: 0.03            # Hausvorteil (3 %): Rückfluss 97 %
  slots:
    jackpot-start: 20000        # Slots-Jackpot (drei Siebener), startet nach einem Gewinn wieder hier
    jackpot-share: 0.02         # so viel von jedem Dreh wandert in den Slots-Jackpot

coinflip:
  max-bet: 5000
  announce-min: 2500   # ab diesem Einsatz geht ein Gewinn an alle mit "Coinflip-Mitteilungen"

quiz:
