plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    // Client-Code (Kamera, Animationen, Rendering) getrennt vom gemeinsamen Code (Netzwerk-Pakete)
    splitEnvironmentSourceSets()
    mods {
        kubyrematch {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }

java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }

// Vorführung ohne Bildschirm: ./gradlew runClient -Pdemo=schuss_normal,jubel -Pzeitlupe=0.25
loom {
    runs {
        client {
            if (project.hasProperty('demo')) {
                vmArg "-Dkuby.demo=${project.property('demo')}"
                vmArg "-Dkuby.demo.zeitlupe=${project.findProperty('zeitlupe') ?: '1'}"
            }
            programArgs '--width', '1280', '--height', '720'
        }
    }
}
