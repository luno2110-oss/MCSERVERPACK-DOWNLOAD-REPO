# Belastungstest für den Beta-Test: echter Paper-1.21.11-Server mit allen Kuby-Jars aus "latest", 10 Bots (mineflayer)
# joinen nach und nach, wechseln zwischen Hub, SMP, Survival und Skyblock, öffnen Menüs (/menu, /shop, /angeln, /insel,
# /feedback …), laufen, bauen ab, schicken sich Geld, melden Bugs und loggen einmal aus und wieder ein (4 Minuten).
# Geprüft: alle Bots kommen rein, keine Kicks, keine Befehlsfehler, keine Exceptions aus Kuby-Klassen, TPS bleibt hoch.
# Ergebnis als Release "load-test" (server.log, loadtest-result.json, problems.txt).
name: Belastungstest

on:
  workflow_run:
    workflows: ["Build plugins"]
    types: [completed]
  workflow_dispatch:

jobs:
  load:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/loadtest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bots installieren und Version wählen
        working-directory: tools/loadtest
        run: |
          npm install --no-audit --no-fund
          node pick_version.js 1.21.11 > version.txt
          cat version.txt
          echo "MC_VERSION=$(sed -n 1p version.txt)" >> "$GITHUB_ENV"
          echo "NEED_VIA=$(sed -n 2p version.txt)" >> "$GITHUB_ENV"

      - name: Paper und Plugins holen
        run: |
          mkdir -p server/plugins
          cd server
          UA="KubyPlugins-CI (github.com/${GITHUB_REPOSITORY})"
          curl -sSf -A "$UA" https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds -o builds.json
          URL=$(python3 -c "import json;b=json.load(open('builds.json'));print(b[0]['downloads']['server:default']['url'])")
          curl -sSfL -A "$UA" "$URL" -o paper.jar
          curl -sSfL "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/KubyPlugins.zip" -o kuby.zip
          unzip -q kuby.zip -d kuby
          cp kuby/*.jar plugins/
          if [ "$NEED_VIA" = "via" ]; then
            for repo in ViaVersion/ViaVersion ViaVersion/ViaBackwards; do
              J=$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/$repo/releases/latest" \
                | python3 -c "import json,sys;print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.jar')][0])")
              echo "Via: $J"
              curl -sSfL "$J" -o "plugins/$(basename $repo).jar"
            done
          fi
          echo "eula=true" > eula.txt
          printf "online-mode=false\nallow-flight=true\nspawn-protection=0\nview-distance=5\nsimulation-distance=5\nmax-players=30\n" > server.properties
          printf "settings:\n  connection-throttle: -1\n" > bukkit.yml

      - name: Erster Start (Configs anlegen)
        working-directory: server
        run: |
          mkfifo console
          java -Xmx3G -jar paper.jar --nogui < console > first.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 300); do grep -q "Done (" first.log && break; kill -0 $PID 2>/dev/null || break; sleep 1; done
          sleep 5
          echo "stop" >&3
          for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          rm console

      - name: Modi für den Test einrichten
        working-directory: server
        run: |
          python3 - <<'EOF'
          import yaml, os
          p = "plugins/KubyCore/config.yml"
          if not os.path.exists(p):
              p = [os.path.join(r, f) for r, _, fs in os.walk("plugins") for f in fs if f == "config.yml" and "Kuby" in r and "modes" in open(os.path.join(r, f), encoding="utf-8").read()][0]
          c = yaml.safe_load(open(p, encoding="utf-8"))
          c.setdefault("modes", {})
          for i, m in enumerate(["hub", "smp", "survival", "skyblock"]):
              c["modes"].setdefault(m, {})
              c["modes"][m]["world"] = "world"
              c["modes"][m]["spawn"] = "world;%d;110;0;0;0" % (i * 300)
          c.setdefault("beta", {})["alle-tester"] = True
          # Bots laden kein Resource Pack: trotzdem die echten Pack-Dialoge (wie echte Spieler mit Pack)
          c.setdefault("ui", {})["custom-textures"] = "on"
          yaml.safe_dump(c, open(p, "w", encoding="utf-8"), allow_unicode=True, sort_keys=False)
          print("Config:", p)
          EOF

      - name: Server starten, Bots spielen lassen, TPS messen
        working-directory: server
        env:
          BOTS: '10'
          DURATION: '240'
        run: |
          mkfifo console
          java -Xmx3G -jar paper.jar --nogui < console > server.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 300); do grep -q "Done (" server.log && break; kill -0 $PID 2>/dev/null || break; sleep 1; done
          sleep 5
          (cd ../tools/loadtest && node bots.js > ../../server/bots.log 2>&1) &
          BOTPID=$!
          # alle 10 s klickt jeder Spieler 3 zufällige Knöpfe im offenen Menü, alle 40 s alle Events, alle 30 s TPS
          for i in $(seq 1 27); do
            sleep 10
            echo "kubytest klicks 3" >&3
            if [ $((i % 4)) -eq 0 ]; then echo "kubytest events" >&3; fi
            if [ $((i % 3)) -eq 0 ]; then echo "tps" >&3; echo "mspt" >&3; fi
          done
          wait $BOTPID || true
          cp ../tools/loadtest/loadtest-result.json . || echo '{}' > loadtest-result.json
          echo "tps" >&3
          sleep 3
          echo "stop" >&3
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true

      - name: Auswerten
        working-directory: server
        run: |
          python3 - <<'EOF' > summary.md
          import json, re
          r = json.load(open("loadtest-result.json"))
          log = open("server.log", encoding="utf-8", errors="replace").read()
          tps = [float(x) for x in re.findall(r"TPS from last 1m, 5m, 15m: \D*([\d.]+)", log)]
          probs = []
          exc = [l for l in log.splitlines() if re.search(r"Exception.*de\.kuby|de\.kuby\..*Exception|at de\.kuby|at Kuby\w*\.jar//|Command exception|Error occurred while enabling|Could not load|Could not pass event|Fehler bei Menü-Klick|Test-Event fehlgeschlagen", l)]
          clicks = sum(int(x) for x in re.findall(r"\[Belastungstest\] (\d+) Menü-Klicks", log))
          opened = sum(int(x) for x in re.findall(r"Menü-Klicks, (\d+) Menüs geöffnet", log))
          evruns = re.findall(r"\[Belastungstest\] Events ausgelöst: (.*)", log)
          games = re.findall(r"\[Angel-Minispiel\] (\w+): ([^,]+), Combo (\d+), Linksklicks (\d+), Rechtsklicks (\d+), A-Ticks (\d+), D-Ticks (\d+)", log)
          gstarted = sum(int(x) for x in re.findall(r"\[Angel-Minispiel\] Test-Runde gestartet für (\d+)", log))
          gsum = [sum(int(g[i]) for g in games) for i in (3, 4, 5, 6)]
          gout = {}
          for g in games: gout[g[1]] = gout.get(g[1], 0) + 1
          n = r.get("bots", 10)
          if r.get("spawned", 0) < n: probs.append("Nur %d von %d Bots sind gespawnt" % (r.get("spawned", 0), n))
          for k in r.get("kicked", []): probs.append("Kick %s: %s" % (k["bot"], k["reason"][:200]))
          for e in r.get("errors", [])[:20]: probs.append("Verbindung %s: %s" % (e["bot"], e["error"][:200]))
          for e in r.get("cmdErrors", [])[:40]: probs.append("Befehlsfehler %s bei %s: %s" % (e["bot"], e["cmd"], e["msg"][:150]))
          probs += ["Log: " + l[:250] for l in exc[:40]]
          if tps and min(tps) < 15: probs.append("TPS fiel auf %.1f" % min(tps))
          if clicks == 0: probs.append("Keine Menü-Klicks ausgeführt")
          if not evruns: probs.append("Keine Events ausgelöst")
          played = [g for g in games if not g[1].startswith("abgebrochen")]
          if not played: probs.append("Angel-Minispiel: keine Runde zu Ende gespielt (gestartet: %d)" % gstarted)
          elif r.get("games", 0) == 0: probs.append("Angel-Minispiel: Bots haben den Spielstart nicht erkannt; Chat: " + " | ".join(r.get("fishChat", [])[:4]))
          elif gsum[0] == 0 or gsum[1] == 0: probs.append("Angel-Minispiel: Klicks kommen nicht an (links %d, rechts %d)" % (gsum[0], gsum[1]))
          print("## Belastungstest")
          print("- Bots: %d, Spawns: %d (davon %d Wiederkehrer), Befehle: %d, Chatzeilen: %d" % (n, r.get("spawned", 0), r.get("rejoins", 0), r.get("commands", 0), r.get("chats", 0)))
          print("- Menü-Klicks (wie echte Klicks, in den Pack-Dialogen): %d, dabei %d Menüs neu geöffnet" % (clicks, opened))
          print("- Event-Runden: %d (%s)" % (len(evruns), evruns[-1].strip() if evruns else "keine"))
          print("- Angel-Minispiel: %d Runden gestartet, %d beendet (%s); am Server angekommen: %d Linksklicks, %d Rechtsklicks, %d Ticks A, %d Ticks D; Bots spielten %d Runden" % (gstarted, len(games), ", ".join("%s %d" % kv for kv in gout.items()) or "keine", gsum[0], gsum[1], gsum[2], gsum[3], r.get("games", 0)))
          print("- TPS (1 min) gemessen: %s" % (", ".join("%.1f" % t for t in tps) or "keine Messung"))
          print("- Kicks: %d, Verbindungsfehler: %d, Befehlsfehler: %d, Exceptions im Log: %d" % (len(r.get("kicked", [])), len(r.get("errors", [])), len(r.get("cmdErrors", [])), len(exc)))
          open("problems.txt", "w").write("\n".join(probs) if probs else "keine Probleme")
          if probs:
              print("\n### Probleme")
              for p in probs[:80]: print("    " + p)
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          if ! grep -q "keine Probleme" problems.txt; then
            head -20 problems.txt | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi

      - name: Ergebnis als Release-Datei (load-test)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: server
        run: |
          [ -f problems.txt ] || echo "kein Ergebnis" > problems.txt
          [ -f loadtest-result.json ] || echo '{}' > loadtest-result.json
          touch bots.log summary.md
          gh release view load-test -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create load-test -R "$GITHUB_REPOSITORY" --title "Belastungstest" --notes "Ergebnis des letzten Belastungstests" --prerelease
          gh release upload load-test server.log bots.log loadtest-result.json problems.txt summary.md -R "$GITHUB_REPOSITORY" --clobber
