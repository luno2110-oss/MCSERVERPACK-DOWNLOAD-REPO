# Bilder aus dem echten Spiel: Vanilla-Minecraft-Java-Client 1.21.11 (ohne Mods) unter Xvfb mit Software-Grafik (Mesa),
# verbindet sich mit einem echten Paper-Server mit allen Kuby-Jars aus "latest", lädt das echte KubyUI-Resource-Pack
# vom Server und wird per /kubytest kamera an die Casino-Tische gestellt, während Bots dort spielen (Blackjack, Poker,
# Roulette) und der Casino-Regeltest eine echte Crash-Runde und einen Slot-Dreh startet. Ergebnis: Release "client-bilder"
# (PNG je Ansicht, client.log, server.log).
name: Client-Bilder

on:
  workflow_run:
    workflows: ["Build plugins"]
    types: [completed]
  workflow_dispatch:

jobs:
  shots:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/clientshot
            tools/loadtest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Xvfb, Mesa und Werkzeuge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils imagemagick xdotool ffmpeg pulseaudio \
            libxrandr2 libxinerama1 libxcursor1 libxi6 libxxf86vm1 libxtst6 > /dev/null
          pip install -q pillow pyyaml

      - name: Bots installieren
        working-directory: tools/loadtest
        run: |
          npm install --no-audit --no-fund
          node pick_version.js 1.21.11 > version.txt
          echo "MC_VERSION=$(sed -n 1p version.txt)" >> "$GITHUB_ENV"
          echo "NEED_VIA=$(sed -n 2p version.txt)" >> "$GITHUB_ENV"

      - name: Client-Dateien aus dem Cache
        uses: actions/cache@v4
        with:
          path: |
            client/libraries
            client/versions
            client/assets
          key: mc-client-1.21.11-v1

      - name: Minecraft-Client holen (Vanilla 1.21.11)
        run: python3 tools/clientshot/prepare.py 1.21.11 "$PWD/client" localhost:25565

      - name: Paper und Plugins holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p server/plugins
          cd server
          UA="KubyPlugins-CI (github.com/${GITHUB_REPOSITORY})"
          curl -sSf -A "$UA" https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds -o builds.json
          URL=$(python3 -c "import json;b=json.load(open('builds.json'));print(b[0]['downloads']['server:default']['url'])")
          curl -sSfL -A "$UA" "$URL" -o paper.jar
          # Jars genau aus dem Build, der diesen Lauf ausgelöst hat (das Release wird bei jedem Push neu angelegt)
          WANT="${{ github.event.workflow_run.head_sha }}"
          for i in $(seq 1 30); do
            NOTES=$(gh release view latest -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
            if [ -z "$WANT" ] || echo "$NOTES" | grep -q "${WANT::7}"; then break; fi
            sleep 10
          done
          echo "Release: $NOTES"
          gh release download latest -p KubyPlugins.zip -R "$GITHUB_REPOSITORY" -O kuby.zip --clobber
          unzip -q kuby.zip -d kuby
          cp kuby/*.jar plugins/
          if [ "$NEED_VIA" = "via" ]; then
            for repo in ViaVersion/ViaVersion ViaVersion/ViaBackwards; do
              J=$(curl -sSf -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/$repo/releases/latest" \
                | python3 -c "import json,sys;print([a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].endswith('.jar')][0])")
              curl -sSfL "$J" -o "plugins/$(basename $repo).jar"
            done
          fi
          echo "eula=true" > eula.txt
          printf "online-mode=false\nallow-flight=true\nspawn-protection=0\nview-distance=6\nsimulation-distance=5\nmax-players=30\n" > server.properties
          printf "settings:\n  connection-throttle: -1\n" > bukkit.yml

      - name: Erster Start (Configs anlegen)
        working-directory: server
        run: |
          mkfifo console
          java -Xmx3G -jar paper.jar --nogui < console > first.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 300); do grep -q "Done (" first.log && break; kill -0 $PID 2>/dev/null || break; sleep 1; done
          sleep 5
          echo "stop" >&3
          for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          rm console
          python3 - <<'EOF'
          import yaml
          p = "plugins/KubyCore/config.yml"
          c = yaml.safe_load(open(p, encoding="utf-8"))
          c.setdefault("modes", {})
          for i, m in enumerate(["hub", "smp", "survival", "skyblock"]):
              c["modes"].setdefault(m, {})
              c["modes"][m]["world"] = "world"
              c["modes"][m]["spawn"] = "world;%d;110;0;0;0" % (i * 300)
          c.setdefault("beta", {})["alle-tester"] = True
          c.setdefault("casino", {}).setdefault("rundgang", {})["aktiv"] = False   # keine Kino-Szenen für die Kamera
          c.setdefault("einfuehrung", {})["aktiv"] = False
          # Goldene Zeit mit der echten Uhr: Zeitzone wählen, in der es jetzt 18 Uhr ist (kein Test-Schalter)
          import datetime
          off = 18 - datetime.datetime.now(datetime.timezone.utc).hour
          if off > 14: off -= 24
          if off < -12: off += 24
          zone = "Etc/GMT" if off == 0 else "Etc/GMT%+d" % (-off)
          c["casino"].setdefault("goldene-zeit", {})["zeitzone"] = zone
          print("Goldene Zeit: Zeitzone", zone)
          yaml.safe_dump(c, open(p, "w", encoding="utf-8"), allow_unicode=True, sort_keys=False)
          EOF

      - name: Server, Bots und Client starten, Bilder aufnehmen
        working-directory: server
        env:
          BOTS: '6'
          DURATION: '330'
        run: |
          mkdir -p shots
          mkfifo console
          java -Xmx3G -jar paper.jar --nogui < console > server.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 300); do grep -q "Done (" server.log && break; kill -0 $PID 2>/dev/null || break; sleep 1; done
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp > xvfb.log 2>&1 &
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          # virtuelle Soundkarte: der Client spielt seine Töne hinein, ffmpeg nimmt sie für die Videos auf
          pulseaudio --start --exit-idle-time=-1 2>/dev/null || pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=rec sink_properties=device.description=rec > /dev/null 2>&1 || true
          pactl set-default-sink rec 2>/dev/null || true
          pactl info 2>/dev/null | grep -i "default sink" || echo "kein PulseAudio"
          clip() { ffmpeg -loglevel error -y -f x11grab -framerate 15 -video_size 1600x900 -i :99 -f pulse -i rec.monitor \
            -t "$2" -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p -vf scale=1280:720 -c:a aac -b:a 128k "shots/$1.mp4" > /dev/null 2>&1 & }
          sleep 2
          glxinfo -B 2>/dev/null | grep -E "OpenGL (renderer|core profile version)" || true
          ../client/launch.sh > client.log 2>&1 &
          CPID=$!
          shot() { import -window root "shots/$1.png"; echo "Bild $1"; }
          # Client im Spiel? (bis 6 Minuten, Software-Grafik ist langsam)
          for i in $(seq 1 360); do grep -q "Kamera joined the game\|Kamera\[.*logged in" server.log && break; kill -0 $CPID 2>/dev/null || break; sleep 1; done
          grep -m1 "Kamera" server.log || { echo "Client nicht beigetreten"; tail -60 client.log; }
          shot 00_beitritt
          (cd ../tools/loadtest && node bots.js > ../../server/bots.log 2>&1) &
          sleep 40
          shot 01_spawn_pack
          echo "kubytest casino 200" >&3
          sleep 30
          # vorab hinfliegen, damit Chunks und Anzeigen geladen sind (Software-Grafik braucht etwas)
          echo "kubytest kamera bj_oben Kamera" >&3
          sleep 25
          for v in bj_oben bj_platz bj_seite poker roulette slots bj_rot bj_violett bj_hocker poker_rot poker_violett; do
            echo "kubytest kamera $v Kamera" >&3
            sleep 9
            shot "10_$v"
          done
          # Blackjack-Runden vom Platz: Austeilen, Zug, Ergebnis (GEWONNEN/VERLOREN, Serie, Bonus)
          echo "kubytest kamera bj_platz Kamera" >&3
          sleep 4
          clip video_blackjack 24
          for k in 01 02 03 04 05 06 07 08 09 10; do sleep 2; shot "11_bj_platz_$k"; done
          # Poker nah: Karten auf dem Tisch, Pot, Knöpfe
          echo "kubytest kamera poker_nah Kamera" >&3
          sleep 6
          for k in 1 2 3 4 5; do sleep 3; shot "12_poker_nah_$k"; done
          # Leisten oben (Geld, Juwelen, Quests) vor und nach zwei Kino-Szenen: dürfen sich nicht verdoppeln
          echo "kubytest kamera bj_oben Kamera" >&3
          sleep 4
          shot "13_leisten_vorher"
          echo "kubytest kino Kamera" >&3
          sleep 16
          shot "13_leisten_nach_2_szenen"
          echo "kubytest regeln" >&3
          sleep 6
          # Casino einrichten (Bereich, Spawnpunkt) wie mit den Werkzeugen, dann /casino: Scoreboard und Musik im Casino
          echo "kubytest einrichten Kamera" >&3
          sleep 12
          shot "14_casino_eingerichtet"
          echo "kubytest kamera crash Kamera" >&3
          clip video_crash 20
          for k in 1 2 3 4 5 6; do sleep 3; shot "20_crash_$k"; done
          echo "kubytest kamera slots Kamera" >&3
          for k in 1 2 3 4 5 6 7 8; do sleep 2; shot "30_slots_$k"; done
          sleep 4
          # Slot-Video: der Kamera-Spieler zieht dreimal selbst den Hebel (Walzen, Einrasten, ggf. Spannungs-Kamera)
          echo "kubytest kamera slots Kamera" >&3
          sleep 3
          clip video_slots 30
          for k in 1 2 3; do sleep 1; echo "kubytest dreh Kamera" >&3; sleep 9; done
          sleep 2
          # Casino-Rundgang (Gastgeber Vincent führt durch alle Stationen) als Video mit Ton
          echo "kubytest rundgang Kamera" >&3
          sleep 1
          clip video_rundgang 160
          for k in 01 02 03 04 05 06 07 08 09 10 11 12; do sleep 12; shot "40_rundgang_$k"; done
          sleep 20
          # Inventar: echte Klick-, Kreativ- und Drop-Events in Survival und Hub (Items durften nicht im Slot festhängen)
          echo "kubytest inventar Kamera" >&3
          sleep 8
          sleep 5
          kill $CPID 2>/dev/null || true
          echo "stop" >&3
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          grep -E "\[Kamera\]|\[Casino-Regel\]|resource pack|Ressourcen|Kamera" server.log | tail -60 || true
          grep -iE "error|exception|pack" client.log | head -40 || true

      - name: Auswerten
        if: always()
        working-directory: server
        run: |
          python3 - <<'EOF' > summary.md
          import glob, os
          from PIL import Image, ImageStat
          shots = sorted(glob.glob("shots/*.png"))
          print("## Bilder aus dem echten Client")
          probs = []
          for f in shots:
              im = Image.open(f).convert("RGB")
              st = ImageStat.Stat(im)
              spread = sum(st.stddev) / 3
              print("- %s: %dx%d, Helligkeit %.0f, Kontrast %.0f" % (os.path.basename(f), im.width, im.height, sum(st.mean) / 3, spread))
              if spread < 4: probs.append("%s ist einfarbig (kein Bild)" % os.path.basename(f))
          if not shots: probs.append("keine Bilder")
          import subprocess, re as _re
          for f in sorted(glob.glob("shots/*.mp4")):
              info = subprocess.run(["ffmpeg", "-hide_banner", "-i", f, "-af", "volumedetect", "-f", "null", "-"], capture_output=True, text=True).stderr
              dur = _re.search(r"Duration: (\S+),", info)
              mean = _re.search(r"mean_volume: (\S+) dB", info)
              peak = _re.search(r"max_volume: (\S+) dB", info)
              print("- Video %s: Länge %s, Ton Mittel %s dB, Spitze %s dB" % (os.path.basename(f), dur.group(1) if dur else "?",
                    mean.group(1) if mean else "?", peak.group(1) if peak else "?"))
          log = open("server.log", encoding="utf-8", errors="replace").read()
          if "Kamera" not in log: probs.append("Client ist dem Server nicht beigetreten")
          import re
          gold = len(re.findall(r"\[Casino-Test\] \w+ \w+: Einsatz .*Goldene Zeit", log))
          wins = len(re.findall(r"\[Casino-Test\] \w+ \w+: Einsatz (\d+), Spiel zahlt (\d+)", log))
          print("- Goldene Zeit (echte Uhr, Zeitzone auf 18 Uhr gestellt): %d Abrechnungen mit Goldener Zeit von %d" % (gold, wins))
          for l in re.findall(r"\[Casino-Regel\] (?:OK|FEHLER) Goldene Zeit nach echter Uhr.*", log): print("  - " + l)
          if wins and gold == 0: probs.append("Goldene Zeit: keine Abrechnung mit Bonus, obwohl es 18 Uhr ist")
          inv = re.findall(r"\[Inventar-Test\] (OK|FEHLER) (.*)", log)
          print("- Inventar (Klicken, Kreativ-Menü, Droppen): " + ("; ".join(k[0] + " " + k[1] for k in inv) if inv else "nicht gelaufen"))
          if not inv or inv[-1][0] != "OK": probs.append("Inventar: " + (inv[-1][1] if inv else "Test nicht gelaufen"))
          ein = re.findall(r"\[Einrichten-Test\] (OK|FEHLER) (.*)", log)
          print("- Casino einrichten (Bereich, Spawnpunkt, /casino, Musik): " + ("; ".join(k[0] + " " + k[1] for k in ein) if ein else "nicht gelaufen"))
          if not ein or ein[-1][0] != "OK": probs.append("Casino einrichten: " + (ein[-1][1] if ein else "Test nicht gelaufen"))
          kino = re.findall(r"\[Kino-Test\] (OK|FEHLER) (.*)", log)
          print("- Leisten oben nach Kino-Szenen: " + ("; ".join(k[0] + " " + k[1] for k in kino) if kino else "nicht gelaufen"))
          if not kino or kino[-1][0] != "OK": probs.append("Leisten oben nach Kino-Szenen: " + (kino[-1][1] if kino else "Test nicht gelaufen"))
          open("problems.txt", "w").write("\n".join(probs) if probs else "keine Probleme")
          for p in probs: print("- Problem: " + p)
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md

      - name: Bilder als Release-Datei (client-bilder)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: server
        run: |
          touch client.log server.log summary.md problems.txt
          gh release view client-bilder -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create client-bilder -R "$GITHUB_REPOSITORY" --title "Client-Bilder" --notes "Bilder aus dem echten Minecraft-Client (Vanilla, Xvfb)" --prerelease
          (cd shots 2>/dev/null && zip -q ../client-bilder.zip *.png) || true
          (cd shots 2>/dev/null && ls *.mp4 >/dev/null 2>&1 && zip -q ../client-videos.zip *.mp4) || true
          [ -f client-videos.zip ] && gh release upload client-bilder client-videos.zip -R "$GITHUB_REPOSITORY" --clobber || true
          gh release upload client-bilder client.log server.log summary.md problems.txt -R "$GITHUB_REPOSITORY" --clobber
          [ -f client-bilder.zip ] && gh release upload client-bilder client-bilder.zip -R "$GITHUB_REPOSITORY" --clobber || true
          if ! grep -q "keine Probleme" problems.txt; then cat problems.txt; exit 1; fi
