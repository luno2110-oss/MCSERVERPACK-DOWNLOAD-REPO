name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: KubyCore bauen
        working-directory: KubyCore-v2.0.14/KubyPlugins
        run: |
          echo "::add-matcher::.github/javac-matcher.json"
          mvn -B -ntp package

      - name: Addons bauen (mit frisch gebautem KubyCore)
        run: |
          CORE=$(ls KubyCore-v2.0.14/KubyPlugins/target/KubyPlugins-*.jar | grep -v sources | head -1)
          for dir in KubySMP-v1.0.2/KubySMP KubyScoreboard-v1.0.2/KubyScoreboard KubySkyblock-v1.2.0/KubySkyblock KubyJR-Addon-1.0.2; do
            mkdir -p "$dir/libs"
            cp "$CORE" "$dir/libs/KubyCore.jar"
            (cd "$dir" && mvn -B -ntp package)
          done

      - name: Jars sammeln
        run: |
          mkdir -p dist
          find . -path '*/target/*.jar' -not -name 'original-*' -not -path '*/libs/*' -exec cp {} dist/ \;
          mv dist/KubyPlugins-*.jar dist/KubyCore.jar
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kuby-plugins
          path: dist/*.jar

      # Fester Download-Link: Release "latest" mit allen Jars, wird bei jedem Push auf main ersetzt.
      - name: Release "latest" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.jar --title "Aktueller Stand" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. KubyCore.jar ist das Hauptplugin, dazu die Addons." --latest
