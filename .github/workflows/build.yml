name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: KubyCore bauen
        working-directory: KubyCore-v2.0.14/KubyPlugins
        run: mvn -B -ntp package

      - name: Addons bauen (mit frisch gebautem KubyCore)
        run: |
          CORE=$(ls KubyCore-v2.0.14/KubyPlugins/target/KubyPlugins-*.jar | grep -v sources | head -1)
          for dir in KubySMP-v1.0.2/KubySMP KubyScoreboard-v1.0.2/KubyScoreboard KubySkyblock-v1.2.0/KubySkyblock KubyJR-Addon-1.0.2; do
            mkdir -p "$dir/libs"
            cp "$CORE" "$dir/libs/KubyCore.jar"
            (cd "$dir" && mvn -B -ntp package)
          done

      - name: Jars sammeln
        run: |
          mkdir -p dist
          find . -path '*/target/*.jar' -not -name 'original-*' -not -path '*/libs/*' -exec cp {} dist/ \;
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kuby-plugins
          path: dist/*.jar
