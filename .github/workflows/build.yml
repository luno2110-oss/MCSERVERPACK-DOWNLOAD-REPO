name: Build plugins

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Grafik-Pack KubyUI zuerst: Schriften prüfen (ein Fehler macht in Minecraft alle Zeichen der Schrift zu Kästchen),
      # mit festen Zeitstempeln und Reihenfolge packen (SHA-1 wechselt nur bei echten Änderungen) und die SHA-1 ins
      # KubyCore-Jar schreiben: das Plugin lädt dann genau das Pack seines eigenen Builds (Zeichen passen zueinander).
      - name: UI-Pack packen
        run: |
          python3 tools/check_fonts.py resourcepack/KubyUI
          find resourcepack/KubyUI -exec touch -d '2026-01-01 00:00:00' {} +
          mkdir -p dist
          (cd resourcepack/KubyUI && find . -type f | sort | zip -X -q -@ ../../dist/KubyUI-Pack.zip)
          SHA=$(sha1sum dist/KubyUI-Pack.zip | cut -c1-40)
          echo "sha1=$SHA" > KubyCore-v2.0.14/KubyPlugins/src/main/resources/ui-pack.properties
          echo "UI_SHA=$SHA" >> "$GITHUB_ENV"
          echo "UI-Pack $SHA"

      - name: KubyCore bauen
        working-directory: KubyCore-v2.0.14/KubyPlugins
        run: |
          echo "::add-matcher::.github/javac-matcher.json"
          mvn -B -ntp package

      - name: Addons bauen (mit frisch gebautem KubyCore)
        run: |
          CORE=$(ls KubyCore-v2.0.14/KubyPlugins/target/KubyPlugins-*.jar | grep -v sources | head -1)
          for dir in KubySMP-v1.0.2/KubySMP KubyScoreboard-v1.0.2/KubyScoreboard KubySkyblock-v1.2.0/KubySkyblock KubySurvival-v1.0.0/KubySurvival KubyJR-Addon-1.0.2; do
            mkdir -p "$dir/libs"
            cp "$CORE" "$dir/libs/KubyCore.jar"
            (cd "$dir" && mvn -B -ntp package)
          done

      - name: Jars sammeln
        run: |
          mkdir -p dist
          find . -path '*/target/*.jar' -not -name 'original-*' -not -path '*/libs/*' -exec cp {} dist/ \;
          mv dist/KubyPlugins-*.jar dist/KubyCore.jar
          mv dist/KubySMP-*.jar dist/KubySMP.jar
          mv dist/KubyScoreboard-*.jar dist/KubyScoreboard.jar
          mv dist/KubySkyblock-*.jar dist/KubySkyblock.jar
          mv dist/KubySurvival-*.jar dist/KubySurvival.jar
          mv dist/KubyJR-Addon-*.jar dist/KubyJR.jar
          cat > dist/INSTALLATION.txt <<'TXT'
          KubyPlugins - Installation
          Stand: Commit ${GITHUB_SHA}

          1. Server stoppen.
          2. Im Ordner plugins alle alten Kuby-Jars loeschen (die Ordner wie KubyCore bleiben, da liegen die Daten).
          3. Alle Jars aus dieser ZIP in den Ordner plugins legen.
          4. Server starten. Im Log muss "Bukkit plugins (6)" stehen.

          KubyCore.jar ist das Hauptplugin, die anderen sind Addons und brauchen KubyCore.
          Welche fremden Plugins optional sind und welche du nicht brauchst: PLUGINS.md
          Beta-Test vorbereiten (server.properties, Tester-Rolle, Feedback): BETA.md
          TXT
          sed -i 's/^          //' dist/INSTALLATION.txt
          sed -i "s/\${GITHUB_SHA}/${GITHUB_SHA::7}/" dist/INSTALLATION.txt
          cp PLUGINS.md BETA.md dist/
          (cd dist && zip -q KubyPlugins.zip *.jar INSTALLATION.txt PLUGINS.md BETA.md KubyUI-Pack.zip)
          ls -la dist

      # Client-Mod „Kuby Rematch“ (Fabric 1.21.11). Liegt bewusst NICHT in KubyPlugins.zip (die ZIP wandert in den
      # plugins-Ordner), sondern als eigene Datei KubyRematch.jar im Release (für den mods-Ordner / das Modpack).
      - name: Rematch-Mod bauen
        working-directory: rematch/mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -q
          cp build/libs/kuby-rematch-*[0-9].jar ../../dist/KubyRematch.jar
          ls -la ../../dist/KubyRematch.jar

      - uses: actions/upload-artifact@v4
        with:
          name: kuby-plugins
          path: dist/*.jar

      # Fester Download-Link: Release "latest" mit allen Jars, wird bei jedem Push auf main ersetzt.
      - name: Release "latest" aktualisieren
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pack zusätzlich unter seiner SHA-1 im festen Release "ui-packs" (bleibt liegen, ältere Plugins finden ihres)
          gh release view ui-packs >/dev/null 2>&1 || gh release create ui-packs --title "UI-Packs je Build" \
            --notes "KubyUI-Pack je Stand, benannt nach den ersten 12 Zeichen der SHA-1. Das Plugin lädt sein passendes Pack selbst." --latest=false
          cp dist/KubyUI-Pack.zip "dist/KubyUI-${UI_SHA::12}.zip"
          gh release upload ui-packs "dist/KubyUI-${UI_SHA::12}.zip" --clobber
          rm "dist/KubyUI-${UI_SHA::12}.zip"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/KubyPlugins.zip dist/KubyUI-Pack.zip dist/*.jar --title "Aktueller Stand" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. KubyPlugins.zip enthält alle Jars und eine Anleitung." --latest
