# Event-Preset „Sommerfest“ (15.7. bis 1.8.). Alle Presets liegen in plugins/KubySurvival/events/ (eine Datei je Event, Dateiname = ID).
# Admins: /kp event presets (Liste) · laden <ID> (sofort starten) · auto (wieder nach Datum) · stop · an|aus <ID> (jedes Jahr
# automatisch ja/nein) · sammeln · regen · feuerwerk · reset <Spieler> · reload. Fehlt eine Datei, kommt sie beim Start zurück.
#
# start/ende: „MM-TT HH:mm“ (deutsche Zeit) oder relativ zu Ostern: „ostern-2 04:00“ (Karfreitag), „ostern+1 04:00“ (Ostermontag).
# grafik: Bilder im Pack (halloween, weihnachten, silvester, valentinstag, ostern, sommer); farbe: Farbe der Meldungen.
# sammeln: Items, die am Survival-Spawn liegen (Event-Währung); selten-…: seltene Sorte (leuchtet, zählt selten-wert).
# spezial: regen-minuten/regen-menge = Sammel-Regen am Spawn mit Meldung; feuerwerk „MM-TT HH:mm“ oder täglich „HH:mm“.
# Kapitel der Reihe nach; „ab“ sperrt bis zu diesem Tag (MM-TT oder ostern±Tage). Belohnungen: coins, waehrung, tokens.
# Ziele (type, arg, menge, bedingung, text):
#   sammeln [selten]        Sammel-Items am Spawn (selten: nur die seltenen)
#   break <Block|Gruppe>    Abbauen (Kürbis/Melone nur gewachsen; Gruppen logs, ores, stones, crops, dig, flowers, #tag)
#   place <Block|Gruppe>    Setzen (lanterns, candles, lights, flowers, saplings, wool, snow, #tag)
#   pickup <Item>           Aufheben (nicht von Spielern weggeworfen)    throw <Item>   Werfen/Zünden (EGG, SNOWBALL, FIREWORK_ROCKET)
#   kill <Mob|monster|animal>  Besiegen (keine Spawner)    craft/eat/smelt <Item>   Herstellen / essen / im Ofen
#   breed/tame [Tier|animal]   Züchten / zähmen          snowball [Ziel]   mit Schneebällen treffen    build SNOW_GOLEM|IRON_GOLEM
#   carve (Kürbis schnitzen) · brew · fish · treasure · cure · raid · trade · shear · enchant
# Bedingungen: nacht, tag, nether, schnee (kalte Gegend), wasser, uhrzeit:18-24 (echte Uhrzeit), grundstueck (eigenes/vertrautes)
# Shop: ART;Wert;Menge;Name;Preis  –  TITLE <Titel-ID>, COSMETIC <Kosmetik-ID>, ITEM <Material>, KEY <Schlüssel>, COINS, TOKENS
name: "Sommerfest"
grafik: sommer
farbe: "#FFC83A"
automatisch: true
start: "07-15 04:00"
ende: "08-01 04:00"
waehrung: "Muscheln"
shop-name: "Strand-Shop"
sammeln:
  item: muschel
  material: NAUTILUS_SHELL
  name: "<#FF9E7A>Muschel"
  selten-item: perle
  selten-material: HEART_OF_THE_SEA
  selten-name: "<white>Perle"
  radius: 70
  max: 40
  alle-sekunden: 20
  selten-chance: 0.08
  selten-wert: 5
spezial:
  regen-minuten: 35
  regen-menge: 30
  feuerwerk: "07-31 22:00"
  feuerwerk-sekunden: 600
kapitel:
  - name: "Sommeranfang"
    text: "Rund um den Spawn liegen Muscheln im Sand. Sammel sie und kühl dich mit Melonen ab."
    coins: 1500
    waehrung: 60
    tokens: 6
    ziele:
      - {type: sammeln, menge: 25, text: "Sammle 25 Muscheln am Spawn"}
      - {type: eat, arg: MELON_SLICE, menge: 16, text: "Iss 16 Melonenscheiben"}
  - name: "Melonenernte"
    text: "Die Melonen sind reif! Ernte gewachsene Melonen und mach glitzernde Melonen daraus."
    coins: 2000
    waehrung: 80
    tokens: 7
    ziele:
      - {type: break, arg: MELON, menge: 32, text: "Ernte 32 Melonen"}
      - {type: craft, arg: GLISTERING_MELON_SLICE, menge: 4, text: "Stell 4 glitzernde Melonen her"}
  - name: "Angelurlaub"
    text: "Ferienzeit ist Angelzeit. Fang Fische und zieh einen Schatz aus dem Wasser."
    coins: 2500
    waehrung: 100
    tokens: 8
    ziele:
      - {type: fish, menge: 25, text: "Fang 25 Fische"}
      - {type: treasure, menge: 2, text: "Angle 2 Schätze"}
  - name: "Abenteuer unter Wasser"
    text: "Die Ertrunkenen bewachen alte Schätze. Tauch ab und besiege sie, und halt am Spawn Ausschau nach Perlen."
    coins: 3000
    waehrung: 100
    tokens: 9
    ziele:
      - {type: kill, arg: DROWNED, menge: 15, text: "Besiege 15 Ertrunkene"}
      - {type: sammeln, arg: selten, menge: 3, text: "Finde 3 Perlen"}
  - name: "Sandburgen"
    text: "Bau die schönste Sandburg des Sommers: Grab Sand und mach Sandstein daraus."
    coins: 2500
    waehrung: 100
    tokens: 8
    ziele:
      - {type: break, arg: SAND, menge: 64, text: "Grab 64 Sand"}
      - {type: craft, arg: SANDSTONE, menge: 32, text: "Stell 32 Sandstein her"}
  - name: "Grillabend"
    text: "Feuer an! Brat Fleisch im Ofen und iss mit deinen Freunden."
    coins: 3000
    waehrung: 120
    tokens: 10
    ziele:
