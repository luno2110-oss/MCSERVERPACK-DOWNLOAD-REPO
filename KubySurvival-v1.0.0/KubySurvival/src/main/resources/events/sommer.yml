  - name: "Sternschnuppennacht"
    text: "In den Sommernächten fallen Sternschnuppen. Bleib wach und besiege Phantome und Monster."
    ab: "07-25"
    coins: 3500
    waehrung: 150
    tokens: 11
    ziele:
      - {type: kill, arg: monster, menge: 30, bedingung: nacht, text: "Besiege nachts 30 Monster"}
      - {type: kill, arg: PHANTOM, menge: 5, text: "Besiege 5 Phantome"}
  - name: "Das große Sommerfest"
    text: "Das Fest beginnt! Zünde Raketen, sammel Muscheln am Spawn und feier den Sommer. Am letzten Abend gibt es ein Feuerwerk über dem Spawn."
    ab: "07-28"
    coins: 5000
    waehrung: 300
    tokens: 20
    ziele:
      - {type: throw, arg: FIREWORK_ROCKET, menge: 15, text: "Zünde 15 Raketen"}
      - {type: sammeln, menge: 50, text: "Sammle 50 Muscheln am Spawn"}
