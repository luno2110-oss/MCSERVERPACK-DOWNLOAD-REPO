# Event-Preset „Silvester“ (29.12. bis 2.1.). Alle Presets liegen in plugins/KubySurvival/events/ (eine Datei je Event, Dateiname = ID).
# Admins: /kp event presets (Liste) · laden <ID> (sofort starten) · auto (wieder nach Datum) · stop · an|aus <ID> (jedes Jahr
# automatisch ja/nein) · sammeln · regen · feuerwerk · reset <Spieler> · reload. Fehlt eine Datei, kommt sie beim Start zurück.
#
# start/ende: „MM-TT HH:mm“ (deutsche Zeit) oder relativ zu Ostern: „ostern-2 04:00“ (Karfreitag), „ostern+1 04:00“ (Ostermontag).
# grafik: Bilder im Pack (halloween, weihnachten, silvester, valentinstag, ostern, sommer); farbe: Farbe der Meldungen.
# sammeln: Items, die am Survival-Spawn liegen (Event-Währung); selten-…: seltene Sorte (leuchtet, zählt selten-wert).
# spezial: regen-minuten/regen-menge = Sammel-Regen am Spawn mit Meldung; feuerwerk „MM-TT HH:mm“ oder täglich „HH:mm“.
# Kapitel der Reihe nach; „ab“ sperrt bis zu diesem Tag (MM-TT oder ostern±Tage). Belohnungen: coins, waehrung, tokens.
# Ziele (type, arg, menge, bedingung, text):
#   sammeln [selten]        Sammel-Items am Spawn (selten: nur die seltenen)
#   break <Block|Gruppe>    Abbauen (Kürbis/Melone nur gewachsen; Gruppen logs, ores, stones, crops, dig, flowers, #tag)
#   place <Block|Gruppe>    Setzen (lanterns, candles, lights, flowers, saplings, wool, snow, #tag)
#   pickup <Item>           Aufheben (nicht von Spielern weggeworfen)    throw <Item>   Werfen/Zünden (EGG, SNOWBALL, FIREWORK_ROCKET)
#   kill <Mob|monster|animal>  Besiegen (keine Spawner)    craft/eat/smelt <Item>   Herstellen / essen / im Ofen
#   breed/tame [Tier|animal]   Züchten / zähmen          snowball [Ziel]   mit Schneebällen treffen    build SNOW_GOLEM|IRON_GOLEM
#   carve (Kürbis schnitzen) · brew · fish · treasure · cure · raid · trade · shear · enchant
# Bedingungen: nacht, tag, nether, schnee (kalte Gegend), wasser, uhrzeit:18-24 (echte Uhrzeit), grundstueck (eigenes/vertrautes)
# Shop: ART;Wert;Menge;Name;Preis  –  TITLE <Titel-ID>, COSMETIC <Kosmetik-ID>, ITEM <Material>, KEY <Schlüssel>, COINS, TOKENS
name: "Silvester"
grafik: silvester
farbe: "#7CE08A"
automatisch: true
start: "12-29 04:00"
ende: "01-02 04:00"
waehrung: "Glücksklee"
shop-name: "Glücks-Shop"
sammeln:
  item: kleeblatt
  material: LIME_DYE
  name: "<#7CE08A>Glücksklee"
  selten-item: kleeblatt_gold
  selten-material: GOLD_NUGGET
  selten-name: "<gold>Goldenes Kleeblatt"
  radius: 70
  max: 40
  alle-sekunden: 20
  selten-chance: 0.08
  selten-wert: 5
spezial:
  regen-minuten: 30
  regen-menge: 30
  feuerwerk: "01-01 00:00"
  feuerwerk-sekunden: 600
kapitel:
  - name: "Glück zum Jahreswechsel"
    text: "Rund um den Spawn wächst Glücksklee. Sammel ihn für ein gutes neues Jahr und stell schon mal Raketen für die große Nacht her."
    coins: 1500
    waehrung: 60
    tokens: 6
    ziele:
      - {type: sammeln, menge: 25, text: "Sammle 25 Glücksklee am Spawn"}
      - {type: craft, arg: FIREWORK_ROCKET, menge: 32, text: "Stell 32 Raketen her"}
  - name: "Pulver und Papier"
    text: "Für ein großes Feuerwerk brauchst du viel Schwarzpulver. Besiege Creeper und mach Papier aus Zuckerrohr."
    coins: 2000
    waehrung: 80
    tokens: 7
    ziele:
      - {type: kill, arg: CREEPER, menge: 15, text: "Besiege 15 Creeper"}
      - {type: craft, arg: PAPER, menge: 32, text: "Stell 32 Papier her"}
  - name: "Bunte Sterne"
    text: "Raketen mit Farben sind die schönsten. Stell Feuerwerkssterne her und probier deine Raketen aus."
    coins: 2500
    waehrung: 100
    tokens: 8
    ziele:
      - {type: craft, arg: FIREWORK_STAR, menge: 16, text: "Stell 16 Feuerwerkssterne her"}
      - {type: throw, arg: FIREWORK_ROCKET, menge: 20, text: "Zünde 20 Raketen"}
  - name: "Bleigießen"
    text: "Was bringt das neue Jahr? Schmilz Erze im Ofen und lies dein Glück daraus. Goldene Kleeblätter bringen besonders viel Glück."
    ab: "12-31"
    coins: 3000
    waehrung: 120
    tokens: 10
    ziele:
      - {type: smelt, menge: 32, text: "Schmilz 32 Items im Ofen"}
      - {type: sammeln, arg: selten, menge: 3, text: "Finde 3 goldene Kleeblätter"}
  - name: "Countdown"
    text: "Die letzten Stunden des Jahres! Zünde zwischen 18 und 24 Uhr (deutsche Zeit) Raketen und sammel Glücksklee am Spawn."
    ab: "12-31"
    coins: 4000
    waehrung: 150
    tokens: 12
    ziele:
      - {type: throw, arg: FIREWORK_ROCKET, menge: 30, bedingung: "uhrzeit:18-24", text: "Zünde zwischen 18 und 24 Uhr 30 Raketen"}
      - {type: sammeln, menge: 30, bedingung: "uhrzeit:18-24", text: "Sammle zwischen 18 und 24 Uhr 30 Glücksklee"}
  - name: "Frohes neues Jahr!"
    text: "Das neue Jahr ist da. Begrüß es mit einem letzten Feuerwerk und fang mit einem guten Vorsatz an: fleißig sein!"
    ab: "01-01"
    coins: 5000
    waehrung: 250
    tokens: 18
    ziele:
      - {type: throw, arg: FIREWORK_ROCKET, menge: 10, text: "Zünde 10 Raketen"}
      - {type: break, arg: stones, menge: 200, text: "Bau 200 Steine ab"}
titel:
  glueckspilz: "<#7CE08A>Glückspilz"
  feuerwerker: "<#FFB040>Feuerwerker"
shop:
  - "ITEM;FIREWORK_ROCKET;64;64 Raketen;40"
  - "ITEM;GUNPOWDER;32;32 Schwarzpulver;40"
  - "COINS;5000;1;5.000 Coins;150"
  - "TOKENS;5;1;5 Tokens;200"
  - "KEY;episch;1;Epischer Schlüssel;350"
  - "COSMETIC;hut_partyhut;1;Partyhut;400"
  - "TITLE;glueckspilz;1;Titel „Glückspilz“;450"
  - "TITLE;feuerwerker;1;Titel „Feuerwerker“;600"
  - "COSMETIC;hut_zylinder;1;Zylinder;800"
