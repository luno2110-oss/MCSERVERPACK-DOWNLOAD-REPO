# Event-Preset „Halloween“ (23.10. bis 1.11.). Alle Presets liegen in plugins/KubySurvival/events/ (eine Datei je Event, Dateiname = ID).
# Admins: /kp event presets (Liste) · laden <ID> (sofort starten) · auto (wieder nach Datum) · stop · an|aus <ID> (jedes Jahr
# automatisch ja/nein) · sammeln · regen · feuerwerk · reset <Spieler> · reload. Fehlt eine Datei, kommt sie beim Start zurück.
#
# start/ende: „MM-TT HH:mm“ (deutsche Zeit) oder relativ zu Ostern: „ostern-2 04:00“ (Karfreitag), „ostern+1 04:00“ (Ostermontag).
# grafik: Bilder im Pack (halloween, weihnachten, silvester, valentinstag, ostern, sommer); farbe: Farbe der Meldungen.
# sammeln: Items, die am Survival-Spawn liegen (Event-Währung); selten-…: seltene Sorte (leuchtet, zählt selten-wert).
# spezial: regen-minuten/regen-menge = Sammel-Regen am Spawn mit Meldung; feuerwerk „MM-TT HH:mm“ oder täglich „HH:mm“.
# Kapitel der Reihe nach; „ab“ sperrt bis zu diesem Tag (MM-TT oder ostern±Tage). Belohnungen: coins, waehrung, tokens.
# Ziele (type, arg, menge, bedingung, text):
#   sammeln [selten]        Sammel-Items am Spawn (selten: nur die seltenen)
#   break <Block|Gruppe>    Abbauen (Kürbis/Melone nur gewachsen; Gruppen logs, ores, stones, crops, dig, flowers, #tag)
#   place <Block|Gruppe>    Setzen (lanterns, candles, lights, flowers, saplings, wool, snow, #tag)
#   pickup <Item>           Aufheben (nicht von Spielern weggeworfen)    throw <Item>   Werfen/Zünden (EGG, SNOWBALL, FIREWORK_ROCKET)
#   kill <Mob|monster|animal>  Besiegen (keine Spawner)    craft/eat/smelt <Item>   Herstellen / essen / im Ofen
#   breed/tame [Tier|animal]   Züchten / zähmen          snowball [Ziel]   mit Schneebällen treffen    build SNOW_GOLEM|IRON_GOLEM
#   carve (Kürbis schnitzen) · brew · fish · treasure · cure · raid · trade · shear · enchant
# Bedingungen: nacht, tag, nether, schnee (kalte Gegend), wasser, uhrzeit:18-24 (echte Uhrzeit), grundstueck (eigenes/vertrautes)
# Shop: ART;Wert;Menge;Name;Preis  –  TITLE <Titel-ID>, COSMETIC <Kosmetik-ID>, ITEM <Material>, KEY <Schlüssel>, COINS, TOKENS
name: "Halloween"
grafik: halloween
farbe: "#FC981F"
automatisch: true
start: "10-23 04:00"
ende: "11-01 04:00"
waehrung: "Candy Corn"
shop-name: "Candy-Shop"
sammeln:
  item: candy_corn
  material: ORANGE_DYE
  name: "<#FC981F>Candy Corn"
  selten-item: candy_corn_purple
  selten-material: PURPLE_DYE
  selten-name: "<light_purple>Lila Candy Corn"
  radius: 70
  max: 40
  alle-sekunden: 20
  selten-chance: 0.08
  selten-wert: 5
spezial:
  regen-minuten: 45
  regen-menge: 30
kapitel:
  - name: "Der Ruf der Hexe"
    text: "Die Hexe am Spawn braucht Vorräte für die Halloween-Nacht. Sammle das Candy Corn, das rund um den Spawn verstreut liegt, ernte Kürbisse und back Kürbiskuchen. Es zählen nur gewachsene Kürbisse, keine gesetzten."
    coins: 1500
    waehrung: 60
    tokens: 6
    ziele:
      - {type: sammeln, menge: 25, text: "Sammle 25 Candy Corn am Spawn"}
      - {type: break, arg: PUMPKIN, menge: 16, text: "Ernte 16 Kürbisse"}
      - {type: craft, arg: PUMPKIN_PIE, menge: 8, text: "Back 8 Kürbiskuchen"}
  - name: "Lichter für die Nacht"
    text: "Mach dein Grundstück bereit für Halloween: Schnitz Kürbisse mit der Schere und stell Laternen und Kerzen auf."
    coins: 2000
    waehrung: 80
    tokens: 7
    ziele:
      - {type: carve, menge: 12, text: "Schnitz 12 Kürbisse"}
      - {type: place, arg: lanterns, menge: 10, bedingung: grundstueck, text: "Stell 10 Laternen auf dein Grundstück"}
      - {type: place, arg: candles, menge: 10, bedingung: grundstueck, text: "Stell 10 Kerzen auf dein Grundstück"}
  - name: "Die Nacht erwacht"
    text: "Wenn es dunkel wird, kommen die Toten aus ihren Löchern. Halt sie nachts zurück. Monster aus Spawnern zählen nicht."
    coins: 2500
    waehrung: 80
    tokens: 8
    ziele:
      - {type: kill, arg: ZOMBIE, menge: 25, bedingung: nacht, text: "Besiege nachts 25 Zombies"}
      - {type: kill, arg: SKELETON, menge: 20, bedingung: nacht, text: "Besiege nachts 20 Skelette"}
  - name: "Hexenjagd"
    text: "Nicht jede Hexe ist so freundlich wie die am Spawn. Besiege fremde Hexen in Sümpfen und dunklen Nächten und lern ihr Handwerk am Braustand."
    coins: 3000
    waehrung: 100
    tokens: 9
    ziele:
      - {type: kill, arg: WITCH, menge: 5, text: "Besiege 5 Hexen"}
      - {type: brew, menge: 9, text: "Brau 9 Tränke"}
  - name: "Das Tal der Seelen"
    text: "Im Nether liegt ein Tal voller verlorener Seelen. Finde es, bring Seelensand mit und vertreib, was dort umherschwebt."
    coins: 3000
    waehrung: 100
    tokens: 9
    ziele:
      - {type: pickup, arg: SOUL_SAND, menge: 64, bedingung: nether, text: "Sammle 64 Seelensand im Nether"}
      - {type: kill, arg: GHAST, menge: 3, text: "Vertreib 3 Ghasts"}
  - name: "Die Knochenfestung"
    text: "In den Netherfestungen wandern die Wither-Skelette durch die Gänge. Zeig ihnen, wer in dieser Nacht spukt."
    coins: 3500
    waehrung: 120
    tokens: 10
    ziele:
      - {type: kill, arg: WITHER_SKELETON, menge: 15, text: "Besiege 15 Wither-Skelette"}
      - {type: pickup, arg: BONE, menge: 20, bedingung: nether, text: "Sammle 20 Knochen im Nether"}
  - name: "Angeln im Mondlicht"
    text: "Bei Nacht beißen die seltsamsten Fische. Wirf die Angel aus, wenn der Mond scheint, und zieh ein paar Schätze aus dem Wasser. Schätze sind besondere Fänge wie Sattel, Namensschild oder verzaubertes Buch."
    coins: 2500
    waehrung: 100
    tokens: 8
    ziele:
      - {type: fish, menge: 15, bedingung: nacht, text: "Fang nachts 15 Fische"}
      - {type: treasure, menge: 2, bedingung: nacht, text: "Angle nachts 2 Schätze"}
  - name: "Schatten am Himmel"
    text: "Wer drei Nächte nicht schläft, bekommt Besuch von Phantomen. Und am Spawn liegt noch mehr Candy Corn, achte auf die seltenen lila Stücke."
    coins: 3000
    waehrung: 120
    tokens: 10
    ziele:
      - {type: kill, arg: PHANTOM, menge: 8, text: "Besiege 8 Phantome"}
      - {type: sammeln, arg: selten, menge: 5, text: "Finde 5 lila Candy Corn"}
  - name: "Der verfluchte Dorfbewohner"
    text: "Ein Fluch hat Dorfbewohner zu Zombies gemacht. Brau Schwächetränke, wirf sie auf einen Zombie-Dorfbewohner und gib ihm danach einen goldenen Apfel."
    ab: "10-27"
    coins: 3000
    waehrung: 120
    tokens: 10
    ziele:
      - {type: craft, arg: GOLDEN_APPLE, menge: 1, text: "Stell einen goldenen Apfel her"}
      - {type: cure, menge: 1, text: "Heil einen Zombie-Dorfbewohner"}
  - name: "Der Kürbiskönig"
    text: "Die Hexe will den größten Kürbisberg des Servers. Bau ein richtiges Kürbisfeld an, iss dich satt und schmück dein Grundstück."
    ab: "10-28"
    coins: 3500
    waehrung: 150
    tokens: 11
    ziele:
      - {type: break, arg: PUMPKIN, menge: 64, text: "Ernte 64 Kürbisse"}
      - {type: eat, arg: PUMPKIN_PIE, menge: 10, text: "Iss 10 Kürbiskuchen"}
      - {type: place, arg: JACK_O_LANTERN, menge: 16, bedingung: grundstueck, text: "Stell 16 Kürbislaternen auf dein Grundstück"}
  - name: "Geisterstunde"
    text: "Zwischen 18 und 24 Uhr (echte Uhrzeit, deutsche Zeit) ist die Grenze zur Geisterwelt am dünnsten. Jag in dieser Zeit Monster und sammel das Candy Corn, das die Geister am Spawn verlieren."
    ab: "10-28"
    coins: 3500
    waehrung: 150
    tokens: 11
    ziele:
      - {type: kill, arg: monster, menge: 40, bedingung: "uhrzeit:18-24", text: "Besiege zwischen 18 und 24 Uhr 40 Monster"}
      - {type: sammeln, menge: 40, bedingung: "uhrzeit:18-24", text: "Sammle zwischen 18 und 24 Uhr 40 Candy Corn"}
  - name: "Die Nacht der Nächte"
    text: "Das große Finale: Schlag einen Überfall auf ein Dorf zurück, vertreib die Plagegeister der Magier und die Hexen, die mitziehen. Danach belohnt dich die Hexe reich."
    ab: "10-29"
    coins: 5000
    waehrung: 300
    tokens: 20
    ziele:
      - {type: raid, menge: 1, text: "Wehr einen Überfall ab"}
      - {type: kill, arg: EVOKER, menge: 2, text: "Besiege 2 Magier"}
      - {type: kill, arg: VEX, menge: 10, text: "Vertreib 10 Plagegeister"}
      - {type: kill, arg: WITCH, menge: 5, text: "Besiege 5 Hexen"}
titel:
  kuerbiskoenig: "<#FF8A1E>Kürbiskönig"
  geisterjaeger: "<#B080FF>Geisterjäger"
