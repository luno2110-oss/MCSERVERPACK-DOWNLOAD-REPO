# Survival-Quests. Format jeder Zeile: "id;Name;Aufgabe;Typ;Menge;Coins;Tokens;XP"
# Typen:
#   break:<MATERIAL|logs|ores|stones|crops|dig>   natürliche Blöcke abbauen (selbst gesetzte zählen nicht)
#   kill:<MOB|monster|animal>                     Mobs besiegen (nicht aus Spawnern)
#   fish, breed, shear, enchant, trade             Fische fangen, Tiere züchten, Schafe scheren, verzaubern, mit Dorfbewohnern handeln
#   craft:<MATERIAL|*>, smelt:<MATERIAL|*>, eat:<MATERIAL|*>
#   jobxp[:<Beruf>]                                Job-XP sammeln
#   playtime                                       Minuten in Survival online
#   stat:<Schlüssel>                               Wert erreichen (claims, player_level, job_level, fish_caught, playtime, ...)
# XP sind Spieler-XP (Level).

daily-count: 4
farmpass-extra-daily: 1         # mit Farmpass so viele Tages-Quests mehr
weekly-count: 3

# Serie: wer an aufeinanderfolgenden Tagen mindestens eine Tages-Quest abholt, baut eine Serie auf.
streak:
  bonus-coins-per-day: 25        # Extra-Coins bei der ersten Tages-Quest des Tages: Serie x Wert (höchstens 30 Tage)
  rewards:                        # Serie;Tokens
    - "3;1"
    - "7;3"
    - "14;5"
    - "30;10"
    - "60;15"
    - "100;25"

daily:
  - "holz;Holz für den Tag;Fälle 48 Baumstämme;break:logs;48;300;0;120"
  - "stein;Ab in den Stein;Baue 128 Stein ab;break:stones;128;250;0;100"
  - "erz;Erzsucher;Baue 16 Erze ab;break:ores;16;400;0;150"
  - "ernte;Erntezeit;Ernte 64 reife Pflanzen;break:crops;64;300;0;120"
  - "graben;Schaufelarbeit;Grabe 96 Blöcke Erde, Sand oder Kies;break:dig;96;250;0;100"
  - "monster;Nachtwache;Besiege 20 Monster;kill:monster;20;400;0;150"
  - "zombie;Zombie-Plage;Besiege 10 Zombies;kill:ZOMBIE;10;300;0;120"
  - "skelett;Knochenjagd;Besiege 8 Skelette;kill:SKELETON;8;300;0;120"
  - "fisch;Anglerglück;Fange 12 Fische;fish;12;350;0;130"
  - "zucht;Nachwuchs;Züchte 8 Tiere;breed;8;300;0;120"
  - "wolle;Schafschur;Schere 10 Schafe;shear;10;250;0;100"
  - "brot;Bäckerei;Stelle 16 Brote her;craft:BREAD;16;250;0;100"
  - "ofen;Schmelzofen;Schmelze 32 Gegenstände;smelt:*;32;300;0;120"
  - "essen;Gut gegessen;Iss 8 Mahlzeiten;eat:*;8;200;0;80"
  - "handel;Händler;Handle 5-mal mit Dorfbewohnern;trade;5;350;0;130"
  - "fleiss;Fleißig;Sammle 600 Job-XP;jobxp;600;400;0;150"
  - "online;Dabei sein;Spiele 45 Minuten in Survival;playtime;45;300;0;150"

weekly:
  - "w_holz;Sägewerk;Fälle 600 Baumstämme;break:logs;600;3000;2;1200"
  - "w_erz;Bergwerk;Baue 200 Erze ab;break:ores;200;4000;2;1500"
  - "w_diamant;Diamantfieber;Baue 20 Diamanterze ab;break:ores_diamond;20;5000;3;2000"
  - "w_monster;Monsterjäger;Besiege 250 Monster;kill:monster;250;4000;2;1500"
