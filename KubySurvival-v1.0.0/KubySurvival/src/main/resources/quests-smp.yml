# SMP-Quests (eigene Aufgaben, eigener Fortschritt, nur im SMP). Format wie quests.yml:
#   "id;Name;Aufgabe;Typ;Menge;Coins;Tokens;XP"
# Typen (zusätzlich zu break, kill, craft, smelt, eat, enchant, fish, playtime, stat):
#   pvp            Spieler besiegen (nicht im Duell)
#   duel           Duelle gewinnen
#   turnier        Turnierrunden gewinnen      turnier_sieg   Turnier gewinnen
#   kopfgeld       Kopfgelder kassieren
#   stat:<Schlüssel>  kills, trophies, smp_xp, deaths_smp, playtime, votes, quests_done, quest_streak_best
# Coins gehen aufs SMP-Konto, XP sind SMP-XP (wie bei Kills), Tokens zählen für den Quest-Rang.

daily-count: 4
weekly-count: 3

set-bonus:
  daily: "400;2"
  weekly: "1500;5"

streak:
  bonus-coins-per-day: 25
  rewards:
    - "3;1"
    - "7;3"
    - "14;5"
    - "30;10"
    - "60;15"
    - "100;25"

