name: KubySurvival
version: 1.0.0
main: de.kuby.kubysurvival.KubySurvival
api-version: '1.21'
depend: [KubyCore]
description: Survival-Teil für KubyCore (Angeln, Landclaims, Jobs)
commands:
  angeln:
    description: "Angel-Menü: Fischbuch, Rute, Verkauf, Bestenliste"
    usage: "/angeln"
  claim:
    description: "Landclaims: Grundstücke sichern und Freunden vertrauen"
    usage: "/claim [axt|ok|zeigen|info|liste|trust <Spieler>|untrust <Spieler>|löschen|hilfe]"
  job:
    description: "Jobs: acht Berufe, Level, Stundenlimit, Wochenauftrag"
    usage: "/job [info <Beruf>|waehlen <Beruf>|limit|auftrag|hilfe]"
    aliases: [jobs]
  quest:
    description: "Quests: täglich, wöchentlich, Geschichte, Team, Meilensteine"
    usage: "/quest [daily|weekly|abholen|streak|top|aus|hilfe]"
    aliases: [quests]
  sidequests:
    description: "Nebenquests bei Figuren"
    usage: "/sidequests [nav|cancel]"
    aliases: [nebenquests, sidequest]
  farmwelt:
    description: "Farmwelt: Rohstoffe abbauen, wird jede Woche neu erstellt"
    usage: "/farmwelt [info]"
    aliases: [farmworld]
  sw:
    description: "Spieler-Warps: alle ansehen, eigenen kaufen und verwalten"
    usage: "/sw [<Name>|create <Name>|manage|help]"
    aliases: [pwarp, playerwarp]
  chestshop:
    description: "Kistenläden: deine Läden und Anleitung"
    usage: "/chestshop [help]"
    aliases: [laden, shops]
  pet:
    description: "Haustiere: Menü, rufen, wegschicken, reiten (Kisten/Ränge: /pet give <Spieler> <id>)"
    usage: "/pet [summon <Name>|dismiss|ride]"
    aliases: [pets, haustier]
  farmpass:
    description: "Farmpass: Vorteile, Haustier, Fliegen (Store: /farmpass give <Spieler> [Tage])"
    usage: "/farmpass [pet|fly|kiste]"
    aliases: [pass]
  werkbank:
    description: "Werkbank überall (Farmpass)"
    aliases: [wb, craft]
  level:
    description: "Dein Level, das eines anderen oder die Rangliste"
    usage: "/level [Spieler|top]"
    aliases: [lvl]
  tokens:
    description: "Deine Tokens; Admins: /tokens give|take|set <Spieler> <Anzahl>"
    usage: "/tokens [give|take|set <Spieler> <Anzahl>]"
  backpack:
    description: "Rucksack öffnen (/backpack item: Rucksack-Item)"
    usage: "/backpack [item]"
    aliases: [rucksack, bp]
  tokenshop:
    description: "Token-Shop"
    usage: "/tokenshop"
  bauwelt:
    description: "In die Bauwelt"
    usage: "/bauwelt"
  tutorial:
    description: "Tour durch Survival: /tutorial [weiter|stop]"
    usage: "/tutorial"
  marry:
    description: "Heiraten: Antrag, Ja-Wort beim Priester, zum Partner, Scheidung"
    usage: "/marry [propose <Spieler>|accept|deny|cancel|church|tp|divorce]"
    aliases: [heiraten, ehe]
  bank:
    description: "Bank: Ehe-Konto und Konten mit Freunden"
    usage: "/bank [einzahlen|abheben <Betrag> [Konto]]"
    aliases: [konto]
  heads:
    description: "Kopf-Datenbank: Deko-Köpfe und Spielerköpfe kaufen"
    usage: "/heads [Suchbegriff]"
    aliases: [koepfe, kopf]
  grab:
    description: "Deine Gräber mit Welt, Koordinaten und Restzeit"
    usage: "/grab"
    aliases: [graeber, graves, grave]
  sit:
    description: "Auf den Boden setzen (aufstehen mit Schleichen)"
    usage: "/sit"
  lay:
    description: "Hinlegen, zählt beim Überspringen der Nacht mit (aufstehen mit Schleichen)"
    usage: "/lay"
    aliases: [liegen]
  moebel:
    description: "Deine Möbel (kaufen im /juwelenshop)"
    usage: "/moebel"
    aliases: [furniture]
