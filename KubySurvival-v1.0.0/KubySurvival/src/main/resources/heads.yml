# Kopf-Datenbank für /heads (Survival). Jeder Kopf kostet heads.price Coins (config.yml im Kern, Standard 1.000).
# Kategorie -> Liste "Name;Quelle". Quelle ist
#   - ein Spielername: Kopf dieses Accounts (z. B. die offiziellen MHF_-Köpfe von Mojang),
#   - "textur:<base64>": eigener Kopf (anlegen mit /kp heads add <kategorie> <Name>, Kopf in der Hand),
#   - "item:<MATERIAL>": Vanilla-Kopf (z. B. item:CREEPER_HEAD).
# Dazu findet /heads <Name> den Kopf jedes Spielers.
kategorien:
  deko:
    name: "Deko & Essen"
    koepfe:
      - "Apfel;MHF_Apple"
      - "Kuchen;MHF_Cake"
      - "Melone;MHF_Melon"
      - "Kürbis;MHF_Pumpkin"
      - "Kaktus;MHF_Cactus"
