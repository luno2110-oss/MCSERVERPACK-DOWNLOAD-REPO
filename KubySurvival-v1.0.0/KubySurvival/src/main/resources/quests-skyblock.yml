# Skyblock-Quests (eigene Aufgaben, eigener Fortschritt, nur in Skyblock). Format wie quests.yml:
#   "id;Name;Aufgabe;Typ;Menge;Coins;Tokens;XP"
# Typen (zusätzlich zu kill, craft, smelt, eat, fish, playtime, stat):
#   abbau:<MATERIAL|ores|ores_<erz>|logs|crops|stones|*>   Blöcke auf der Insel abbauen (auch aus dem Bruchstein-
#                                                           Generator; selbst gesetzte zählen nicht, Pflanzen nur reif)
#   oneblock[:<MATERIAL>]   den One-Block abbauen
#   gen_place[:<art>]       Generator einsetzen (kaufen oder Item per Rechtsklick) (art: geld, xp, erz, holz, farm, mob, nether, edelstein; Stufen:
#                           lohe, netherit im Nether-Bereich, ender, shulker im End-Bereich)
#   gen_collect[:<art>]     Items aus Generatoren einsammeln      gen_geld[:<art>]  $ mit Generatoren verdienen
#   gen_xp[:<art>]          XP aus Generatoren einsammeln         gen_upgrade[:<art>]  Generator-Stufe kaufen
#   gen_veredeln[:<art>]    Generator veredeln (Silber, Gold, Diamant)
#   insel_upgrade[:size|slots|generator]   Insel-Upgrade kaufen   insel_besuch  fremde Insel besuchen
#   stat:<Schlüssel>        island_level, island_points, island_members, island_stage (1 Nether, 2 End), generators,
#                           playtime, quests_done, ...
# Coins gehen aufs Skyblock-Konto, XP sind Skyblock-XP, Tokens zählen für den Quest-Rang.

daily-count: 4
weekly-count: 3

