# Haustiere. Jedes Haustier: Name, Tier (Minecraft-Entity), baby (klein bleiben), reitbar (nur Pferde-Arten und Kamel),
# preis (Coins im Haustier-Menü, 0 = nicht kaufbar), quelle (Text im Menü, woher man es sonst bekommt).
# Farmpass-Haustiere und Monats-Haustiere stehen in der Kern-Config (farmpass.pets / farmpass.monthly-pets).
# Kisten und Ränge vergeben Haustiere per "/pet give <Spieler> <id>" oder mit der Permission kuby.pet.<id>.
